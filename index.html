<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oregon LiDAR Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #e5e5e5;
}

.leaflet-top.leaflet-right {
  top: 10px;
  right: 8px;
}

.leaflet-control-layers {
  max-width: min(230px, calc(100vw - 28px));
  max-height: 48vh;
  overflow-y: auto;
  background: white;
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 14px;
}

.leaflet-control-layers-expanded {
  padding: 10px 12px;
}

.leaflet-control-layers label {
  margin: 6px 0;
}

.leaflet-control-layers-separator {
  margin: 8px 0;
}

/* DOGAMI opacity */
#opacityControl {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1000;
  width: 180px;
  padding: 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
}

#opacityControl input {
  width: 100%;
  margin: 5px 0 8px;
}

#opacityValue, #perimeterOpacityValue {
  font-weight: bold;
}

.opacity-row-label {
  display: block;
  margin-top: 7px;
}

/* Fire perimeter glow */
.fire-perimeter-glow {
  filter: drop-shadow(0 0 4px rgba(255,20,0,0.9));
}

/* Map coordinate display */
#coordinates {
  position: absolute;
  top: 135px;
  left: 10px;
  z-index: 1000;
  max-width: calc(100vw - 40px);
  padding: 8px 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* Live GPS coordinate display */
#gpsCoordinates {
  position: absolute;
  top: 185px;
  left: 10px;
  z-index: 1000;
  max-width: calc(100vw - 40px);
  padding: 8px 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* GPS button */
#gpsButton {
  position: absolute;
  left: 10px;
  bottom: 24px;
  z-index: 1100;
  min-width: 48px;
  min-height: 48px;
  padding: 10px 13px;
  border: 0;
  border-radius: 7px;
  background: rgba(255,255,255,0.97);
  box-shadow: 0 1px 6px #777;
  color: #1f2937;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#gpsButton:active {
  background: #e8f1ff;
}

#gpsButton[aria-pressed="true"] {
  color: #1769d2;
  outline: 2px solid #1769d2;
}

/* GPS accuracy circle */
.gps-accuracy-circle {
  stroke: #2478e5;
  stroke-opacity: 0.75;
  stroke-width: 1.5;
  fill: #3388ff;
  fill-opacity: 0.16;
}

/* Blue GPS dot */
.gps-location-dot {
  width: 16px;
  height: 16px;
  background: #2583ff;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow: 0 1px 5px rgba(0,0,0,0.55);
  box-sizing: border-box;
}

/* ADS-B aircraft icon: nose points north; rotate to track heading */
.aircraft-icon {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: center center;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
}

.aircraft-icon svg {
  width: 27px;
  height: 27px;
  overflow: visible;
}

.aircraft-icon path {
  fill: #ffdf38;
  stroke: #202020;
  stroke-width: 1.4;
  stroke-linejoin: round;
}

.aircraft-popup {
  min-width: 190px;
  line-height: 1.55;
}

.aircraft-popup strong {
  font-size: 15px;
}

.aircraft-popup .aircraft-heading {
  color: #555;
  font-size: 12px;
}

@media (max-width: 600px) {
  .leaflet-top.leaflet-right {
    top: 10px;
    right: 6px;
  }

  .leaflet-control-layers {
    max-height: 42vh;
    font-size: 13px;
  }

  #opacityControl {
    top: 10px;
    left: 6px;
    width: 145px;
    padding: 8px;
    font-size: 12px;
  }

  #coordinates {
    top: 125px;
    left: 6px;
    max-width: 155px;
    font-size: 12px;
  }

  #gpsCoordinates {
    top: 175px;
    left: 6px;
    max-width: 155px;
    font-size: 12px;
  }

  #gpsButton {
    left: 8px;
    bottom: 18px;
    min-width: 48px;
    min-height: 48px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div id="opacityControl">
  <div><strong>DOGAMI opacity:</strong>
    <span id="opacityValue">60%</span>
  </div>
  <input id="opacitySlider" type="range" min="0" max="100" value="60">
  <label class="opacity-row-label" for="perimeterOpacitySlider">
    <strong>Fire perimeter fill:</strong>
    <span id="perimeterOpacityValue">25%</span>
  </label>
  <input id="perimeterOpacitySlider" type="range" min="0" max="100" value="25">
</div>

<div id="coordinates">Click Map for Coordinates</div>
<div id="gpsCoordinates">GPS: Off — tap GPS to start</div>

<button id="gpsButton" type="button"
        aria-pressed="false"
        title="Show my phone's GPS location">◎ GPS</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function () {
  "use strict";

  const map = L.map("map", {
    zoomControl: false,
    doubleClickZoom: true
  }).setView([42.4368, -123.1400], 11);

  // ============================================================
  // BASE MAPS
  // ============================================================

  const streetMap = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Tiles &copy; Esri",
      maxZoom: 19
    }
  ).addTo(map);

  const topoMap = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenTopoMap contributors",
      maxZoom: 17
    }
  );

  // ============================================================
  // DOGAMI HILLSHADE
  // ============================================================

  const dogamiUrl =
    "https://gis.dogami.oregon.gov/arcgis/rest/services/lidar/DIGITAL_TERRAIN_MODEL_MOSAIC_HS/ImageServer/exportImage";

  const hillshade = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 0.60,
      interactive: false
    }
  );

  // ============================================================
  // PLSS SECTIONS
  // ============================================================

  const plssUrl =
    "https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/PLSS/MapServer/export";

  const plss = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 1,
      interactive: false
    }
  );

  let hillshadeRequest = 0;
  let plssRequest = 0;
  let refreshTimer = null;

  function makeExportUrl(serviceUrl, params) {
    return serviceUrl + "?" +
      new URLSearchParams(params).toString();
  }

  function updateHillshade() {
    if (!map.hasLayer(hillshade)) return;

    const size = map.getSize();
    if (size.x < 1 || size.y < 1) return;

    const bounds = map.getBounds();
    const south = bounds.getSouth();
    const west = bounds.getWest();
    const north = bounds.getNorth();
    const east = bounds.getEast();

    const imageBounds = L.latLngBounds(
      [south, west],
      [north, east]
    );

    const params = {
      bbox: [west, south, east, north].join(","),
      bboxSR: "4326",
      imageSR: "4326",
      size: Math.max(1, Math.round(size.x)) + "," +
            Math.max(1, Math.round(size.y)),
      format: "png32",
      transparent: "true",
      f: "image"
    };

    const requestNumber = ++hillshadeRequest;
    const url = makeExportUrl(dogamiUrl, params);
    const testImage = new Image();

    testImage.onload = function () {
      if (requestNumber !== hillshadeRequest) return;
      if (!map.hasLayer(hillshade)) return;
      hillshade.setBounds(imageBounds);
      hillshade.setUrl(url);
    };

    testImage.onerror = function () {
      if (requestNumber !== hillshadeRequest) return;
      console.error("DOGAMI hillshade request failed:", url);
    };

    testImage.src = url;
  }

  function updatePLSS() {
    if (!map.hasLayer(plss)) return;

    const size = map.getSize();
    if (size.x < 1 || size.y < 1) return;

    const bounds = map.getBounds();
    const south = bounds.getSouth();
    const west = bounds.getWest();
    const north = bounds.getNorth();
    const east = bounds.getEast();

    const imageBounds = L.latLngBounds(
      [south, west],
      [north, east]
    );

    const params = {
      bbox: [west, south, east, north].join(","),
      bboxSR: "4326",
      imageSR: "4326",
      size: Math.max(1, Math.round(size.x)) + "," +
            Math.max(1, Math.round(size.y)),
      format: "png32",
      transparent: "true",
      layers: "show:0,1",
      f: "image"
    };

    const requestNumber = ++plssRequest;
    const url = makeExportUrl(plssUrl, params);
    const testImage = new Image();

    testImage.onload = function () {
      if (requestNumber !== plssRequest) return;
      if (!map.hasLayer(plss)) return;
      plss.setBounds(imageBounds);
      plss.setUrl(url);
    };

    testImage.onerror = function () {
      if (requestNumber !== plssRequest) return;
      console.error("PLSS image request failed:", url);
    };

    testImage.src = url;
  }

  function refreshVisibleOverlays() {
    clearTimeout(refreshTimer);

    refreshTimer = setTimeout(function () {
      updateHillshade();
      updatePLSS();
    }, 200);
  }

  // ============================================================
  // SHARED HELPERS
  // ============================================================

  function escapeHtml(value) {
    return String(value == null || value === ""
      ? "Not reported" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // ============================================================
  // ADS-B AIRCRAFT
  // ============================================================

  // Fixed Rogue River area, 100 nautical mile radius.
  const adsbUrl =
    "https://api.adsb.lol/v2/lat/42.44/lon/-123.17/dist/100";

  const aircraftLayer = L.layerGroup().addTo(map);
  const aircraftMarkers = new Map();

  const AIRCRAFT_REFRESH_MS = 10000;
  let aircraftRequestInProgress = false;
  let aircraftRefreshTimer = null;
  let lastAircraftSuccess = 0;

  // ADS-B "track" is degrees clockwise from north.
  // SVG airplane shape points north at zero degrees.
  function makeAircraftIcon(track) {
    const heading = Number.isFinite(Number(track))
      ? Number(track) : 0;

    return L.divIcon({
      className: "",
      html:
        '<div class="aircraft-icon" style="transform:rotate(' +
        heading + 'deg)">' +
        '<svg viewBox="0 0 24 28" aria-hidden="true">' +
        '<path d="M12 1 L15 10 L22 14 L22 17 L15 15 ' +
        'L15 22 L18 24 L18 26 L12 24 L6 26 L6 24 ' +
        'L9 22 L9 15 L2 17 L2 14 L9 10 Z"/>' +
        '</svg></div>',
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -13]
    });
  }

  function formatAltitude(value) {
    if (value === "ground") return "On ground";

    const altitude = Number(value);

    return Number.isFinite(altitude)
      ? Math.round(altitude).toLocaleString() + " ft"
      : "Not reported";
  }

  function formatSpeed(value) {
    const speed = Number(value);

    return Number.isFinite(speed)
      ? Math.round(speed) + " knots"
      : "Not reported";
  }

  function formatHeading(value) {
    const heading = Number(value);

    return Number.isFinite(heading)
      ? Math.round(heading) + "°"
      : "Not reported";
  }

  function aircraftPopup(ac) {
    const callsign = String(ac.flight || "").trim() || "Unknown";
    const registration = ac.r || "Not reported";
    const type = ac.t || "Not reported";
    const altitude = formatAltitude(ac.alt_baro);
    const speed = formatSpeed(ac.gs);
    const heading = formatHeading(ac.track);

    const verticalRate = Number(ac.geom_rate);
    const climb = Number.isFinite(verticalRate)
      ? Math.round(verticalRate) + " ft/min"
      : "Not reported";

    return (
      '<div class="aircraft-popup">' +
      '<strong>' + escapeHtml(callsign) + '</strong><br>' +
      '<span class="aircraft-heading">ADS-B aircraft</span><br>' +
      '<b>Registration:</b> ' + escapeHtml(registration) + '<br>' +
      '<b>Aircraft type:</b> ' + escapeHtml(type) + '<br>' +
      '<b>Altitude:</b> ' + escapeHtml(altitude) + '<br>' +
      '<b>Ground speed:</b> ' + escapeHtml(speed) + '<br>' +
      '<b>Heading:</b> ' + escapeHtml(heading) + '<br>' +
      '<b>Vertical rate:</b> ' + escapeHtml(climb) +
      '</div>'
    );
  }

  async function updateAircraft() {
    if (!map.hasLayer(aircraftLayer)) return;

    if (aircraftRequestInProgress) return;
    aircraftRequestInProgress = true;

    try {
      const response = await fetch(adsbUrl, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (!Array.isArray(data.ac)) {
        throw new Error(data.msg || "Unexpected ADS-B response");
      }

      // If the layer was hidden while the request was running,
      // don't add markers back to it.
      if (!map.hasLayer(aircraftLayer)) return;

      const now = Date.now();
      const seenAircraft = new Set();
      let updatedCount = 0;

      data.ac.forEach(function (ac) {
        const lat = Number(ac.lat);
        const lng = Number(ac.lon);

        // Aircraft without a valid position cannot be mapped.
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
        if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

        // Ignore positions that are more than two minutes old.
        // Some aircraft may not have a position timestamp.
        const seenPosition = Number(ac.seen_pos);

        if (Number.isFinite(seenPosition) &&
            seenPosition > 120) return;

        // ICAO hex is the primary stable identifier.
        // Fall back to registration if necessary.
        const id = String(ac.hex || ac.r || "").trim();
        if (!id) return;

        seenAircraft.add(id);
        updatedCount++;

        let marker = aircraftMarkers.get(id);

        if (!marker) {
          marker = L.marker([lat, lng], {
            icon: makeAircraftIcon(ac.track),
            keyboard: true,
            riseOnHover: true,
            zIndexOffset: 500
          });

          marker.bindPopup(aircraftPopup(ac));
          marker.addTo(aircraftLayer);
          aircraftMarkers.set(id, marker);
        } else {
          // Move the existing marker; don't create duplicates.
          marker.setLatLng([lat, lng]);
          marker.setIcon(makeAircraftIcon(ac.track));
          marker.setPopupContent(aircraftPopup(ac));

          // If its popup is open, refresh the displayed details.
          if (marker.isPopupOpen()) {
            marker.setPopupContent(aircraftPopup(ac));
          }
        }

        marker.options.lastSeenUpdate = now;
      });

      // Remove aircraft that disappeared from the feed or have
      // stale positions. Keep the marker set synchronized.
      aircraftMarkers.forEach(function (marker, id) {
        if (!seenAircraft.has(id)) {
          aircraftLayer.removeLayer(marker);
          aircraftMarkers.delete(id);
        }
      });

      lastAircraftSuccess = now;

      console.info(
        "ADSB.lol: " + updatedCount + " aircraft mapped."
      );

    } catch (error) {
      // Keep existing markers if a temporary refresh fails.
      console.error("Could not refresh ADS-B aircraft:", error);
    } finally {
      aircraftRequestInProgress = false;
    }
  }

  function startAircraftRefresh() {
    if (aircraftRefreshTimer !== null) {
      clearInterval(aircraftRefreshTimer);
    }

    updateAircraft();

    aircraftRefreshTimer = setInterval(
      updateAircraft,
      AIRCRAFT_REFRESH_MS
    );
  }

  function stopAircraftRefresh() {
    if (aircraftRefreshTimer !== null) {
      clearInterval(aircraftRefreshTimer);
      aircraftRefreshTimer = null;
    }
  }

  // Start immediately because the aircraft layer is enabled by default.
  startAircraftRefresh();

  // ============================================================
  // NIFC / IRWIN FIRE ACTIVITY - LAST 24 HOURS
  // ============================================================

  const nifc24hUrl =
    "https://services3.arcgis.com/T4QMspbfLg3qTGWY/ArcGIS/rest/services/WFIGS_Incident_Locations_Last24h/FeatureServer/0/query";

  const nifcFireLayer = L.layerGroup().addTo(map);
  let nifcRefreshInProgress = false;

  function fireTypeLabel(code) {
    if (code === "WF") return "Wildfire";
    if (code === "RX") return "Prescribed fire";
    if (code === "CX") return "Incident complex";
    return code || "Fire activity";
  }

  function fireMarkerColor(code) {
    if (code === "RX") return "#2e9d50";
    if (code === "CX") return "#f28c00";
    if (code === "WF") return "#d62828";
    return "#555555";
  }

  async function updateNifcFires() {
    if (nifcRefreshInProgress || !map.hasLayer(nifcFireLayer)) return;
    nifcRefreshInProgress = true;

    const params = new URLSearchParams({
      where: "POOState = 'US-OR'",
      outFields: "IncidentName,IncidentTypeCategory,InitialLatitude,InitialLongitude,POOCounty,POOProtectingAgency,POOState",
      outSR: "4326",
      f: "json"
    });

    try {
      const response = await fetch(nifc24hUrl + "?" + params.toString());
      if (!response.ok) throw new Error("HTTP " + response.status);

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || "NIFC query failed");

      const replacementLayer = L.layerGroup();
      const features = Array.isArray(data.features) ? data.features : [];

      features.forEach(function (feature) {
        const props = feature.attributes || {};
        const geometry = feature.geometry || {};

        const lat = Number(
          geometry.y != null ? geometry.y : props.InitialLatitude
        );
        const lng = Number(
          geometry.x != null ? geometry.x : props.InitialLongitude
        );

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        const type = props.IncidentTypeCategory || "";
        const name = props.IncidentName || "Unnamed incident";

        const marker = L.circleMarker([lat, lng], {
          radius: 7,
          color: "#ffffff",
          weight: 1.5,
          fillColor: fireMarkerColor(type),
          fillOpacity: 0.95
        });

        marker.bindPopup(
          "<div style='min-width:180px'>" +
          "<strong>" + escapeHtml(name) + "</strong><br>" +
          "Type: " + escapeHtml(fireTypeLabel(type)) + "<br>" +
          "County: " + escapeHtml(props.POOCounty) + "<br>" +
          "Protecting agency: " + escapeHtml(props.POOProtectingAgency) + "<br>" +
          "State: " + escapeHtml(props.POOState) +
          "</div>"
        );

        marker.addTo(replacementLayer);
      });

      nifcFireLayer.clearLayers();
      replacementLayer.eachLayer(function (layer) {
        layer.addTo(nifcFireLayer);
      });

      console.info("NIFC/IRWIN Oregon incidents:", features.length);

    } catch (error) {
      console.error("Could not refresh NIFC/IRWIN fire activity:", error);
    } finally {
      nifcRefreshInProgress = false;
    }
  }

  updateNifcFires();
  setInterval(updateNifcFires, 5 * 60 * 1000);

  // ============================================================
  // CURRENT FIRE PERIMETERS
  // ============================================================

  const perimeterQueryUrl =
    "https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Interagency_Perimeters_Current/FeatureServer/0/query";

  const firePerimeterLayer = L.layerGroup().addTo(map);
  let perimeterRefreshInProgress = false;
  let perimeterFillOpacity = 0.25;

  function perimeterStyle() {
    return {
      color: "#ff2100",
      weight: 3,
      opacity: 0.95,
      fillColor: "#ff1600",
      fillOpacity: perimeterFillOpacity,
      className: "fire-perimeter-glow",
      lineCap: "round",
      lineJoin: "round"
    };
  }

  function formatAcres(value) {
    const acres = Number(value);

    return Number.isFinite(acres)
      ? acres.toLocaleString(undefined, { maximumFractionDigits: 1 }) + " acres"
      : "Not reported";
  }

  async function updateFirePerimeters() {
    if (perimeterRefreshInProgress || !map.hasLayer(firePerimeterLayer)) return;
    perimeterRefreshInProgress = true;

    const params = new URLSearchParams({
      where: "attr_POOCounty = 'JACKSON' OR attr_POOCounty = 'JOSEPHINE'",
      outFields: "poly_IncidentName,poly_GISAcres,attr_POOCounty",
      outSR: "4326",
      returnGeometry: "true",
      f: "json"
    });

    try {
      const response = await fetch(perimeterQueryUrl + "?" + params.toString());
      if (!response.ok) throw new Error("HTTP " + response.status);

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || "Perimeter query failed");

      const replacementLayer = L.layerGroup();
      const features = Array.isArray(data.features) ? data.features : [];

      features.forEach(function (feature) {
        const attrs = feature.attributes || {};
        const geometry = feature.geometry || {};
        const rings = Array.isArray(geometry.rings) ? geometry.rings : [];

        if (!rings.length) return;

        const latLngRings = rings.map(function (ring) {
          return ring.map(function (point) {
            return [Number(point[1]), Number(point[0])];
          });
        });

        if (!latLngRings[0] || latLngRings[0].length < 3) return;

        const polygon = L.polygon(latLngRings, perimeterStyle());

        polygon.bindPopup(
          "<div style='min-width:180px'>" +
          "<strong>" + escapeHtml(attrs.poly_IncidentName || "Unnamed fire perimeter") + "</strong><br>" +
          "County: " + escapeHtml(attrs.attr_POOCounty) + "<br>" +
          "Reported size: " + escapeHtml(formatAcres(attrs.poly_GISAcres)) +
          "</div>"
        );

        polygon.addTo(replacementLayer);
      });

      firePerimeterLayer.clearLayers();
      replacementLayer.eachLayer(function (layer) {
        layer.addTo(firePerimeterLayer);
      });

      console.info("NIFC fire perimeters:", features.length);

    } catch (error) {
      console.error("Could not refresh NIFC fire perimeters:", error);
    } finally {
      perimeterRefreshInProgress = false;
    }
  }

  updateFirePerimeters();
  setInterval(updateFirePerimeters, 5 * 60 * 1000);

  // ============================================================
  // LAYER MENU
  // ============================================================

  L.control.layers(
    {
      "Esri Street Map": streetMap,
      "OpenTopoMap": topoMap
    },
    {
      "DOGAMI LiDAR": hillshade,
      "PLSS Sections": plss,
      "NIFC Fires (24h)": nifcFireLayer,
      "SWO Perimeters": firePerimeterLayer,
      "ADS-B Aircraft": aircraftLayer
    },
    {
      collapsed: true,
      position: "topright"
    }
  ).addTo(map);

  map.on("overlayadd", function (event) {
    if (event.layer === hillshade) updateHillshade();
    if (event.layer === plss) updatePLSS();
    if (event.layer === nifcFireLayer) updateNifcFires();
    if (event.layer === firePerimeterLayer) updateFirePerimeters();

    if (event.layer === aircraftLayer) {
      startAircraftRefresh();
    }
  });

  map.on("overlayremove", function (event) {
    if (event.layer === aircraftLayer) {
      stopAircraftRefresh();
    }
  });

  map.on("moveend", refreshVisibleOverlays);
  map.on("zoomend", refreshVisibleOverlays);

  map.on("resize", function () {
    refreshVisibleOverlays();
  });

  if (typeof ResizeObserver !== "undefined") {
    const observer = new ResizeObserver(function () {
      map.invalidateSize({ pan: false });
      refreshVisibleOverlays();
    });

    observer.observe(document.getElementById("map"));
  }

  // ============================================================
  // OPACITY CONTROLS
  // ============================================================

  const opacitySlider = document.getElementById("opacitySlider");
  const opacityValue = document.getElementById("opacityValue");

  L.DomEvent.disableClickPropagation(
    document.getElementById("opacityControl")
  );

  opacitySlider.addEventListener("input", function () {
    const opacity = Number(opacitySlider.value) / 100;
    hillshade.setOpacity(opacity);
    opacityValue.textContent = opacitySlider.value + "%";
  });

  const perimeterOpacitySlider =
    document.getElementById("perimeterOpacitySlider");

  const perimeterOpacityValue =
    document.getElementById("perimeterOpacityValue");

  perimeterOpacitySlider.addEventListener("input", function () {
    perimeterFillOpacity = Number(perimeterOpacitySlider.value) / 100;
    perimeterOpacityValue.textContent = perimeterOpacitySlider.value + "%";

    firePerimeterLayer.eachLayer(function (layer) {
      layer.setStyle({ fillOpacity: perimeterFillOpacity });
    });
  });

  // ============================================================
  // COORDINATES: DEGREES AND DECIMAL MINUTES ONLY
  // ============================================================

  function toDDM(value) {
    const sign = value < 0 ? "-" : "";
    const absolute = Math.abs(value);
    const degrees = Math.floor(absolute);
    const minutes = (absolute - degrees) * 60;

    return sign + degrees + "° " + minutes.toFixed(3) + "'";
  }

  const coordinatesDisplay = document.getElementById("coordinates");
  const gpsCoordinatesDisplay = document.getElementById("gpsCoordinates");

  map.on("click", function (event) {
    coordinatesDisplay.textContent =
      toDDM(event.latlng.lat) + "  " +
      toDDM(event.latlng.lng);
  });

  // ============================================================
  // PHONE GPS
  // ============================================================

  const gpsButton = document.getElementById("gpsButton");

  let gpsWatchId = null;
  let gpsMarker = null;
  let gpsAccuracy = null;
  let gpsHasCentered = false;

  const gpsIcon = L.divIcon({
    className: "",
    html: '<div class="gps-location-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });

  L.DomEvent.disableClickPropagation(gpsButton);

  function stopGpsTracking() {
    if (gpsWatchId !== null && navigator.geolocation) {
      navigator.geolocation.clearWatch(gpsWatchId);
    }

    gpsWatchId = null;
    gpsHasCentered = false;

    gpsButton.setAttribute("aria-pressed", "false");
    gpsButton.textContent = "◎ GPS";
    gpsButton.title = "Show my phone's GPS location";

    gpsCoordinatesDisplay.textContent = "GPS: Off — tap GPS to start";
  }

  function gpsError(error) {
    stopGpsTracking();

    if (error.code === 1) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Permission denied. Allow browser location access, then try again.";
    } else if (error.code === 2) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Could not determine location. Check device location services.";
    } else if (error.code === 3) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Timed out. Tap GPS to try again.";
    } else {
      gpsCoordinatesDisplay.textContent = "GPS: Unable to get location.";
    }
  }

  gpsButton.addEventListener("click", function () {
    if (gpsWatchId !== null) {
      stopGpsTracking();
      return;
    }

    if (!("geolocation" in navigator)) {
      gpsCoordinatesDisplay.textContent =
        "GPS: This browser does not support location access.";
      return;
    }

    if (!window.isSecureContext) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Requires a secure HTTPS page. Open the map using HTTPS.";
      return;
    }

    gpsHasCentered = false;

    gpsButton.setAttribute("aria-pressed", "true");
    gpsButton.textContent = "GPS…";
    gpsButton.title = "Stop GPS tracking";

    gpsCoordinatesDisplay.textContent =
      "GPS: Waiting for device location…";

    gpsWatchId = navigator.geolocation.watchPosition(
      function (position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = Math.max(0, position.coords.accuracy || 0);
        const location = L.latLng(lat, lng);

        if (!gpsAccuracy) {
          gpsAccuracy = L.circle(location, {
            radius: accuracy,
            className: "gps-accuracy-circle",
            interactive: false
          }).addTo(map);
        } else {
          gpsAccuracy.setLatLng(location);
          gpsAccuracy.setRadius(accuracy);
        }

        if (!gpsMarker) {
          gpsMarker = L.marker(location, {
            icon: gpsIcon,
            interactive: false,
            keyboard: false,
            zIndexOffset: 1000
          }).addTo(map);
        } else {
          gpsMarker.setLatLng(location);
        }

        gpsCoordinatesDisplay.textContent =
          "GPS: " + toDDM(lat) + "  " + toDDM(lng) +
          "  (±" + Math.round(accuracy) + " m)";

        gpsButton.textContent = "GPS ON";

        // Center only on the first GPS fix.
        if (!gpsHasCentered) {
          map.setView(location, Math.max(map.getZoom(), 15));
          gpsHasCentered = true;
        }
      },
      gpsError,
      {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 20000
      }
    );
  });

  // Initial map sizing
  setTimeout(function () {
    map.invalidateSize();
  }, 500);

})();
</script>

</body>
</html>
