<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPOTAC | Tactical Mapping System</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #e5e5e5;
}

.leaflet-top.leaflet-right {
  top: 10px;
  right: 8px;
  /* Keep the layer menu above custom map controls when expanded. */
  z-index: 2000;
}

.leaflet-control-layers {
  max-width: min(230px, calc(100vw - 28px));
  max-height: 48vh;
  overflow-y: auto;
  background: white;
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 14px;
}

.leaflet-control-layers-expanded {
  padding: 10px 12px;
}
.leaflet-control-layers label {
  margin: 6px 0;
}

.leaflet-control-layers-separator {
  margin: 8px 0;
}

/*  opacity and fire perimeter fill controls */
#opacityControl {
  position: absolute;
  top: 12px;
  left: 10px;
  z-index: 1000;
  width: 180px;
  padding: 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
}

#opacityControl input {
  width: 100%;
  margin: 5px 0 8px;
}

/* Bright red fire perimeter outline with subtle glow */
.fire-perimeter-glow {
  filter: drop-shadow(0 0 4px rgba(255, 20, 0, 0.9));
}

/* Map-click coordinate display */
#coordinates {
  position: absolute;
  top: 80px;
  left: 10px;
  z-index: 1000;
  max-width: calc(100vw - 40px);
  padding: 8px 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* Live GPS coordinate display */
#gpsCoordinates {
  position: absolute;
  top: 115px;
  left: 10px;
  z-index: 1000;
  max-width: calc(100vw - 40px);
  padding: 8px 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* Parcel situs address, below GPS coordinates */
#situsAddress {
  position: absolute; top: 160px; left: 10px; z-index: 1000;
  max-width: min(320px, calc(100vw - 30px)); padding: 8px 10px;
  background: rgba(255,255,255,.96); border-radius: 6px;
  box-shadow: 0 1px 6px #777; font-size: 13px; overflow-wrap: anywhere;
}

/* GPS button */
#gpsButton {
  position: absolute;
  left: 10px;
  bottom: 24px;
  z-index: 1100;
  min-width: 48px;
  min-height: 48px;
  padding: 10px 13px;
  border: 0;
  border-radius: 7px;
  background: rgba(255,255,255,0.97);
  box-shadow: 0 1px 6px #777;
  color: #1f2937;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#gpsButton:active {
  background: #e8f1ff;
}

#gpsButton[aria-pressed="true"] {
  color: #1769d2;
  outline: 2px solid #1769d2;
}


/* Clear GPS track button */
#clearTrackButton {
  position: absolute;
  left: 10px;
  bottom: 82px;
  z-index: 1100;
  min-height: 42px;
  padding: 9px 12px;
  border: 0;
  border-radius: 7px;
  background: rgba(255,255,255,0.97);
  box-shadow: 0 1px 6px #777;
  color: #b42318;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#clearTrackButton:active {
  background: #fee2e2;
}

@media (max-width: 600px) {
  #clearTrackButton {
    left: 8px;
    bottom: 76px;
  }
}

/* GPX import controls */
.gpx-button {
  position: absolute;
  left: 10px;
  z-index: 1100;
  min-height: 40px;
  padding: 9px 12px;
  border: 0;
  border-radius: 7px;
  background: rgba(255,255,255,0.97);
  box-shadow: 0 1px 6px #777;
  color: #1f2937;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}
  
#gpxImportButton {
  bottom: 136px;
}

#clearGpxButton {
  bottom: 184px;
  color: #b42318;
}

#gpxFileInput {
  display: none;
}
  
#gpxStatus {
  position: absolute;
  left: 10px;
  bottom: 234px;
  z-index: 1000;
  max-width: min(300px, calc(100vw - 30px));
  padding: 7px 9px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 12px;
  display: none !important;
}
.gpx-start-marker, .gpx-end-marker {
  width: 12px;
  height: 12px;
  border: 2px solid white;
  border-radius: 50%;
  box-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.gpx-start-marker { background: #16803c; }
.gpx-end-marker { background: #d62828; }

/* GPS accuracy circle */
.gps-accuracy-circle {
  stroke: #2478e5;
  stroke-opacity: 0.75;
  stroke-width: 1.5;
  fill: #3388ff;
  fill-opacity: 0.16;
}

/* Blue GPS dot */
.gps-location-dot {
  width: 16px;
  height: 16px;
  background: #2583ff;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow: 0 1px 5px rgba(0,0,0,0.55);
  box-sizing: border-box;
}

/* RAWS station marker */
.raws-station-marker {
  stroke: #ffffff;
  stroke-width: 1.5;
  fill: #087f8c;
  fill-opacity: 1;
}

/* USGS waterbody polygons */
.usgs-waterbody {
  color: #1769d2;
  weight: 1.5;
  fillColor: #42a5f5;
  fillOpacity: 0.55;
}


@media (max-width: 600px) {
  .leaflet-top.leaflet-right {
    top: 10px;
    right: 6px;
  }

  .leaflet-control-layers {
    max-height: 42vh;
    max-width: 210px;
    overflow-y: auto;
    font-size: 13px;
  }

  #opacityControl {
    top: 10px;
    left: 6px;
    width: 145px;
    box-sizing: border-box;
    padding: 8px;
    font-size: 12px;
  }

  #coordinates {
    top: 116px;
    left: 6px;
    max-width: 180px;
    font-size: 12px;
  }

  #gpsCoordinates {
    top: 160px;
    left: 6px;
    width: 180px;
    font-size: 12px;
  }

#situsAddress {
    top: 215px;
    left: 6px;
    width: 180px;
    box-sizing: border-box;
    font-size: 12px;
}

  /* PORTRAIT BUTTONS - BOTTOM TO TOP */

  #clearTrackButton {
    left: 8px;
    bottom: 12px;
    min-height: 40px;
  }

  #gpsButton {
    left: 8px;
    bottom: 64px;
    min-width: 48px;
    min-height: 40px;
  }

  .gpx-button {
    left: 8px;
    min-height: 40px;
    box-sizing: border-box;
    font-size: 12px;
    padding: 8px 10px;
  }

  #clearGpxButton {
    left: 8px;
    bottom: 116px;
  }

  #gpxImportButton {
    left: 8px;
    bottom: 168px;
  }

  #gpxStatus {
    left: 6px;
    bottom: 220px;
    max-width: 155px;
    font-size: 11px;
  }
}

.fire-label {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid #777;
  border-radius: 3px;
  color: #111;
  font-size: 11px;
  font-weight: bold;
  padding: 2px 4px;
  box-shadow: 0 1px 3px #777;
}


#mapGuideButton {
  position: absolute;
  top: 12px;
  left: 205px;
  z-index: 1000;
  padding: 8px 12px;
  background: #263746;
  color: white;
  border: 1px solid white;
  border-radius: 5px;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}

@media (max-width: 600px) {
  #mapGuideButton {
    top: 76px;
    left: 6px;
  }
}

/* PHONE LANDSCAPE LAYOUT */
@media (max-width: 900px) and (orientation: landscape) {

  /* Keep the layer menu in the upper-right */
  .leaflet-top.leaflet-right {
    top: 10px;
    right: 6px;
  }

  .leaflet-control-layers {
    max-height: 65vh;
    max-width: 210px;
    overflow-y: auto;
    font-size: 12px;
  }

  /* TOP ROW: opacity, map coordinates, GPS coordinates */
  #opacityControl {
    top: 8px;
    left: 6px;
    width: 145px;
    box-sizing: border-box;
    padding: 6px;
    font-size: 11px;
  }

  #coordinates {
    top: 8px;
    left: 161px;
    width: 155px;
    max-width: 155px;
    box-sizing: border-box;
    padding: 6px;
    font-size: 11px;
  }

  #gpsCoordinates {
    top: 8px;
    left: 326px;
    width: 220px;
    max-width: 220px;
    box-sizing: border-box;
    padding: 6px;
    font-size: 11px;
  }

  /* MAP GUIDE: below opacity, against the left edge */
  #mapGuideButton {
    top: 65px;
    left: 6px;
  }

  /* BOTTOM ROW: OPEN GPX, CLEAR GPX, GPS, CLEAR TRACK */
  .gpx-button {
    bottom: 8px;
    min-height: 40px;
    box-sizing: border-box;
    padding: 6px 9px;
    font-size: 11px;
  }

  #gpxImportButton {
    left: 8px;
    bottom: 8px;
  }

  #clearGpxButton {
    left: 88px;
    bottom: 8px;
    color: #c62828;
  }

  #gpsButton {
    left: 175px;
    bottom: 8px;
    width: 68px;
    min-width: 68px;
    min-height: 40px;
    box-sizing: border-box;
    padding: 6px 9px;
    font-size: 12px;
  }

  #clearTrackButton {
    left: 255px;
    bottom: 8px;
    min-height: 40px;
    box-sizing: border-box;
    padding: 6px 9px;
    font-size: 11px;
  }

  /* Situs address: beside CLEAR GPS in landscape */
  #situsAddress {
    top: auto;
    bottom: 8px;
    left: 343px;
    max-width: calc(100vw - 385px);
    box-sizing: border-box;
    font-size: 11px;
  }

  /* GPX status above the bottom row */
  #gpxStatus {
    left: 8px;
    bottom: 54px;
    max-width: 210px;
    font-size: 10px;
  }
}
  

/* TOPOTAC tactical accent; keep basemap and operational symbology unchanged. */
#mapGuideButton { background:#171717; border-color:#ff861c; color:#fff; }
#mapGuideButton:hover { background:#df6900; }
#gpsButton[aria-pressed="true"] { outline-color:#f47a13; }

/* Marked points: independent from GPS and GPX */
.point-button {position:absolute;left:10px;z-index:1100;min-height:40px;padding:8px 11px;border:0;border-radius:7px;background:rgba(255,255,255,.97);box-shadow:0 1px 6px #777;font-size:12px;font-weight:bold;cursor:pointer;touch-action:manipulation}
#addPointButton {bottom:284px}
#clearPointsButton {bottom:332px;color:#b42318}
#enterCoordsButton {bottom:380px}
#addPointButton[aria-pressed="true"] {background:#ff861c;color:#111;outline:2px solid #111}
.marked-point-pin {width:26px;height:26px;border-radius:50%;background:#ff861c;color:#111;border:2px solid #fff;box-shadow:0 1px 5px #333;display:flex;align-items:center;justify-content:center;font:bold 12px Arial}
#pointEntryPanel {position:absolute;left:10px;bottom:430px;z-index:1500;background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 12px #555;width:min(285px,calc(100vw - 25px));font-size:13px;box-sizing:border-box}
#pointEntryPanel[hidden] {display:none}
#pointEntryPanel input,#pointEntryPanel select {box-sizing:border-box;width:100%;padding:7px;margin:4px 0 8px;border:1px solid #aaa;border-radius:4px}
#pointEntryPanel button {padding:7px 9px;margin-right:5px}
#pointEntryError {color:#a02020;min-height:15px}
@media(max-width:600px) and (orientation:portrait) {
 #addPointButton {left:8px;bottom:220px}
 #clearPointsButton {left:8px;bottom:268px}
 #enterCoordsButton {left:8px;bottom:316px}
 #pointEntryPanel {left:8px;bottom:365px}
}
@media(max-width:900px) and (orientation:landscape) {
 #addPointButton {left:343px;bottom:8px}
 #clearPointsButton {left:438px;bottom:8px}
 #enterCoordsButton {left:550px;bottom:8px}
 #pointEntryPanel {left:auto;right:8px;bottom:58px}
 #situsAddress {bottom:57px;left:343px;max-width:210px}
}

</style>
</head>

<body>

<a id="mapGuideButton"
   href="guide.html"
   title="Open the map guide">MAP GUIDE</a>

<div id="map"></div>

<div id="opacityControl">
  <div><strong>LiDaR opacity:</strong>
    <span id="opacityValue">60%</span>
  </div>
  <input id="opacitySlider" type="range" min="0" max="100" value="60">
</div>

<div id="coordinates">Click Map for Coordinates</div>
<div id="gpsCoordinates">GPS: Off — tap GPS to start</div>
<div id="situsAddress" role="status" aria-live="polite">Situs: GPS off</div>

<button id="gpsButton" type="button"
        aria-pressed="false"
        title="Show my phone's GPS location">◎ GPS</button>

<button id="clearTrackButton" type="button"
        title="Delete the entire GPS track">CLEAR GPS</button>

<button id="gpxImportButton" class="gpx-button" type="button"
        title="Open a GPX track file from this device">OPEN GPX</button>
  
<button id="clearGpxButton" class="gpx-button" type="button"
        title="Remove imported GPX tracks from the map">CLEAR GPX</button>
  
<input id="gpxFileInput" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" multiple>
<div id="gpxStatus" role="status" aria-live="polite"></div>


<button id="addPointButton" class="point-button" type="button" aria-pressed="false">ADD POINT</button>
<button id="clearPointsButton" class="point-button" type="button">CLEAR POINTS</button>
<button id="enterCoordsButton" class="point-button" type="button">ENTER COORDS</button>
<div id="pointEntryPanel" hidden>
  <strong>Enter Coordinates</strong>
  <label for="pointFormat">Format</label>

<select id="pointFormat">
  <option value="ddm">Degrees / decimal minutes (DDM)</option>
  <option value="dd">Decimal degrees (DD)</option>
</select>

  <label for="pointLat">Latitude (N positive, S negative)</label>
  <input id="pointLat" type="text" placeholder="42° 26.208' N">
  <label for="pointLng">Longitude (W negative)</label>
  <input id="pointLng" type="text" placeholder="123° 08.400' W">
  <label for="pointName">Name (optional)</label>
  <input id="pointName" type="text" maxlength="80" placeholder="Water source">
  <div id="pointEntryError" role="status"></div>
  <button id="placeEnteredPoint" type="button">PLACE POINT</button>
  <button id="closePointEntry" type="button">CANCEL</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function () {
  "use strict";

  const map = L.map("map", {
    zoomControl: false,
    doubleClickZoom: true
  }).setView([42.4368, -123.1400], 9);

  // =========================================================
  // BASE MAPS
  // =========================================================

  const streetMap = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Tiles &copy; Esri",
      maxZoom: 19
    }
  ).addTo(map);

  const topoMap = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenTopoMap contributors",
      maxZoom: 19
    }
  );

  const aerialMap = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Imagery &copy; Esri, Vantor, Earthstar Geographics, and the GIS User Community",
      maxZoom: 19
    }
  );

  // =========================================================
  // DOGAMI LIDAR HILLSHADE
  // =========================================================

  const dogamiUrl =
    "https://gis.dogami.oregon.gov/arcgis/rest/services/lidar/DIGITAL_TERRAIN_MODEL_MOSAIC_HS/ImageServer/exportImage";

  const hillshade = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 0.60,
      interactive: false
    }
  );

  // =========================================================
  // PUBLIC LAND OWNERSHIP
  // =========================================================

  const publicLandUrl =
    "https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/PublicOwnership/MapServer/export";

  const publicLand = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 0.65,
      interactive: false
    }
  );

  // =========================================================
  // PLSS SECTIONS
  // =========================================================

  const plssUrl =
    "https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/PLSS/MapServer/export";

  const plss = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 1,
      interactive: false
    }
  );

  // Statewide ODF tax lot display, rendered only for the visible map extent.
  const taxlotService = "https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/TaxlotsDisplay/MapServer";
  const taxlots = L.imageOverlay("", [[42, -124], [43, -122]], {opacity: 0.9, interactive: false});
  let taxlotRequest = 0;
  let taxlotMetadataPromise = null;
  let taxlotLayers = [];
  let situsRequest = 0;
  let lastSitusPoint = null;
  let lastSitusTime = 0;
  const situsDisplay = document.getElementById("situsAddress");

  function loadTaxlotMetadata() {
    if (!taxlotMetadataPromise) {
      taxlotMetadataPromise = fetch(taxlotService + "?f=pjson")
        .then(r => { if (!r.ok) throw Error("Taxlot metadata HTTP " + r.status); return r.json(); })
        .then(data => {
          if (data.error) throw Error(data.error.message || "Taxlot metadata error");
          taxlotLayers = (data.layers || []).filter(l => l.type === "Feature Layer" ||
            (l.subLayerIds == null && l.type !== "Group Layer"));
          return data;
        }).catch(err => { taxlotMetadataPromise = null; throw err; });
    }
    return taxlotMetadataPromise;
  }

  async function updateTaxlots() {
    if (!map.hasLayer(taxlots)) return;
    const request = ++taxlotRequest;
    if (map.getZoom() < 14) { taxlots.setOpacity(0); return; }
    taxlots.setOpacity(0.9);
    const size = map.getSize();
    const bounds = map.getBounds();
    const sw = L.CRS.EPSG3857.project(bounds.getSouthWest());
    const ne = L.CRS.EPSG3857.project(bounds.getNorthEast());
    const params = {
      bbox: [sw.x, sw.y, ne.x, ne.y].join(","), bboxSR: "3857", imageSR: "3857",
      size: Math.round(size.x) + "," + Math.round(size.y), format: "png32",
      transparent: "true", f: "image"
    };
    const url = makeExportUrl(taxlotService + "/export", params);
    const img = new Image();
    img.onload = () => {
      if (request !== taxlotRequest || !map.hasLayer(taxlots)) return;
      taxlots.setBounds(bounds);
      taxlots.setUrl(url);
    };
    img.onerror = () => console.warn("Tax lot overlay could not load");
    img.src = url;
  }

  // ArcGIS REST JSONP fallback for services that do not allow browser CORS.
  function arcgisJsonp(url, params) {
    return new Promise((resolve, reject) => {
      const callback = "__odfTaxlotCallback" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
      const script = document.createElement("script");
      let finished = false;
      const timer = setTimeout(() => finish(new Error("Service timed out")), 12000);
      function finish(error, result) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        delete window[callback];
        script.remove();
        if (error) reject(error); else resolve(result);
      }
      window[callback] = data => finish(null, data);
      script.onerror = () => finish(new Error("Service blocked or unreachable"));
      const q = new URLSearchParams(params);
      q.set("f", "json");
      q.set("callback", callback);
      script.src = url + "?" + q.toString();
      document.head.appendChild(script);
    });
  }

  async function taxlotRest(url, params) {
    const query = new URLSearchParams(params);
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 7000);
      let response;
      try { response = await fetch(url + "?" + query, {signal: controller.signal}); }
      finally { clearTimeout(timer); }
      if (!response.ok) throw Error("HTTP " + response.status);
      const data = await response.json();
      if (data.error) throw Error(data.error.message || "ArcGIS service error");
      return data;
    } catch (firstError) {
      console.warn("Tax lot direct request failed; trying JSONP:", firstError);
      const data = await arcgisJsonp(url, params);
      if (data.error) throw Error(data.error.message || "ArcGIS service error");
      return data;
    }
  }

  // Query-enabled sources; keep the ODF image overlay for statewide boundaries.
  const parcelSources = [
    {name:"Oregon Water Resources", url:"https://gis.wrd.state.or.us/server/rest/services/tax/Tax_Lots_Public_View_WGS84/FeatureServer/2/query"},
    {name:"Jackson County", url:"https://jcportal.jacksoncountyor.gov/server/rest/services/Property/Taxlots/FeatureServer/2/query"},
    {name:"Josephine County", url:"https://gis.co.josephine.or.us/arcgis/rest/services/Assessor/Assessor_Taxlots/FeatureServer/0/query"}
  ];
  function taxlotField(attrs, pattern) {
    const key = Object.keys(attrs).find(k => pattern.test(k));
    const value = key ? attrs[key] : null;
    return value == null || String(value).trim() === "" || /^null$/i.test(String(value)) ? "" : String(value).trim();
  }
  function parcelDetails(a) {
    const street = taxlotField(a, /^(site_address|SITEADDNAM|SITUS|SITUS_ADDRESS|SitusAddrsFull|SitusAddrs|SITUSADDR|STREETADDRESS)$/i);
    const cityzip = taxlotField(a, /^(site_citystatezip|SitusCityStateZip)$/i);
    const city = taxlotField(a, /^(SITEADDCTY|SITUS_CITY|SitusCity)$/i);
    const zip = taxlotField(a, /^(SITEZIP|SITUS_ZIP|SitusZip1)$/i);
    const lot = taxlotField(a, /^(maptaxlot|map_taxlot|ortaxlot|taxlot|taxlot_id|MAPNUMBER|MAPNUM|ACCOUNT|ACCOUNTNO|ACCT)$/i);
    const acres = taxlotField(a, /^(taxlot_acre|ACRES|GISACRES|ACREAGE)$/i);
    const address = [street, cityzip || [city,zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    return {address,lot,acres};

  // A point query avoids downloading statewide parcel geometry and works independently of map view.
  async function queryParcelAt(lat,lng) {
    const params = {
      where: "1=1", geometry: JSON.stringify({x:lng,y:lat,spatialReference:{wkid:4326}}),
      geometryType: "esriGeometryPoint", inSR:"4326", spatialRel:"esriSpatialRelIntersects",
      outFields:"*", returnGeometry:"false", resultRecordCount:"3", f:"json"
    };
    let lastError = null;
    let foundWithoutAddress = null;
    for (const source of parcelSources) {
      try {
        const data = await taxlotRest(source.url,params);
        const features = Array.isArray(data.features) ? data.features : [];
        if (features.length) {
          const matches = features.map(f=>({source:source.name, details:parcelDetails(f.attributes||{})}));
          const withAddress = matches.find(m=>m.details.address);
          if (withAddress) return withAddress;
          if (!foundWithoutAddress) foundWithoutAddress = matches[0];
        }
      } catch (err) {
        lastError = err;
        console.warn(source.name + " parcel query failed:",err);
      }
    }
    if (foundWithoutAddress) return foundWithoutAddress;
    if (lastError) throw Error("No parcel returned; one or more services failed. " + lastError.message);
    return null;
  }

  // =========================================================

  const nifc24hUrl =

  function fireTypeLabel(code) {
    if (code === "WF") return "Wildfire";
    if (code === "RX") return "Prescribed fire";
    if (code === "CX") return "Incident complex";
    return code || "Fire activity";
  }

  function fireMarkerColor(code) {
    if (code === "RX") return "#2e9d50";
    if (code === "CX") return "#f28c00";
    if (code === "WF") return "#d62828";
    return "#555555";
  }

  async function updateNifcFires() {
    if (nifcRefreshInProgress || !map.hasLayer(nifcFireLayer)) return;

    nifcRefreshInProgress = true;

    const params = new URLSearchParams({
      where: "POOState = 'US-OR'",
      outFields: "IncidentName,IncidentTypeCategory,InitialLatitude,InitialLongitude,POOCounty,POOProtectingAgency,POOState,FireDiscoveryDateTime",
      outSR: "4326",
      f: "json"
    });

    try {
      const response = await fetch(
        nifc24hUrl + "?" + params.toString()
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error.message || "NIFC query failed");
      }

      const replacementLayer = L.layerGroup();
      const seenFireLocations = new Map();
      const features = Array.isArray(data.features) ? data.features : [];

      features.forEach(function (feature) {
        const props = feature.attributes || {};
        const geometry = feature.geometry || {};

        const lat = Number(
          geometry.y != null ? geometry.y : props.InitialLatitude
        );

        const lng = Number(
          geometry.x != null ? geometry.x : props.InitialLongitude
        );

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng) ||
          lat < -90 || lat > 90 ||
          lng < -180 || lng > 180 ||
          (lat === 0 && lng === 0)
        ) return;

        const type = props.IncidentTypeCategory || "";
        const discoveryDate = props.FireDiscoveryDateTime
        ? new Date(props.FireDiscoveryDateTime).toLocaleString()
        : "Not reported";
        const fireName = props.IncidentName || "Unnamed Fire";
        const fireLabel = `${type || "Fire"}-${fireName}`;

        const marker = L.circleMarker([lat, lng], {
          radius: 6,
          color: "#ffffff",
          weight: 1.5,
          fillColor: fireMarkerColor(type),
          fillOpacity: 1
        });

        const locationKey = `${lat.toFixed(5)},${lng.toFixed(5)}`;
        const duplicateCount = seenFireLocations.get(locationKey) || 0;

        seenFireLocations.set(locationKey, duplicateCount + 1);

        const labelOffsetY = duplicateCount * 25;

        marker.bindTooltip(fireLabel, {
          permanent: true,
          direction: "right",
          offset: [7, -labelOffsetY],
          className: "fire-label"
        });

        const popup =
          "<div style='min-width:180px'>" +
          "<strong>" + escapeHtml(fireName) + "</strong><br>" +
          "Type: " + escapeHtml(fireTypeLabel(type)) + "<br>" +
          "Discovery date/time: " + escapeHtml(discoveryDate) + "<br>" +
          "County: " + escapeHtml(props.POOCounty) + "<br>" +
          "Protecting agency: " + escapeHtml(props.POOProtectingAgency) + "<br>" +
          "State: " + escapeHtml(props.POOState) +
          "</div>";

        marker.bindPopup(popup);
        marker.addTo(replacementLayer);
      });

      nifcFireLayer.clearLayers();

      replacementLayer.eachLayer(function (layer) {
        layer.addTo(nifcFireLayer);
      });

      console.info(
        "NIFC/IRWIN Oregon incidents in last-24-hour feed:",
        features.length
      );

      console.error("Could not refresh NIFC/IRWIN fire activity:", error);

    const sequence = ++currentRequestSequence;
    if (currentAbortController) currentAbortController.abort();
    const controller = new AbortController();
    currentAbortController = controller;
    const base = {
      where: "1=1", geometry: bbox, geometryType: "esriGeometryEnvelope",
      inSR: "3857", spatialRel: "esriSpatialRelIntersects",

        const params = new URLSearchParams({...base, resultOffset: String(offset)});

        if (!response.ok) throw Error("Current perimeter HTTP " + response.status);

        const page = Array.isArray(data.features) ? data.features : [];

  function formatHistoricalDate(value) {
    if (value == null || value === "") return "Not reported";

    const timestamp = Number(value);

    if (!Number.isFinite(timestamp) || timestamp <= 0) {
      return "Not reported";
    }

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Not reported";

    return escapeHtml(date.toLocaleDateString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric"
    }));
  }

  function formatHistoricalDateTime(value) {
    if (value == null || value === "") return "Not reported";

    const timestamp = Number(value);

    if (!Number.isFinite(timestamp) || timestamp <= 0) {
      return "Not reported";
    }

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Not reported";

    return escapeHtml(date.toLocaleString());
  }

  function formatHistoricalCoordinate(value) {
    const number = Number(value);

    if (!Number.isFinite(number)) return "Not reported";

    const sign = number < 0 ? "-" : "";
    const absolute = Math.abs(number);
    const degrees = Math.floor(absolute);
    const minutes = ((absolute - degrees) * 60).toFixed(3);

    return sign + degrees + "° " + minutes + "'";

          escapeHtml(historicalFireType(a.attr_IncidentTypeCategory)) +
          "<br>" +
          "<strong>GIS acres:</strong> " +
          escapeHtml(formatAcres(a.poly_GISAcres)) + "<br>" +
          "<strong>Reported incident size:</strong> " +
          escapeHtml(formatAcres(a.attr_IncidentSize)) + "<br>" +
          "<strong>Discovered:</strong> " +
          discoveryDate + "<br>" +
          "<strong>Perimeter date:</strong> " +
          formatHistoricalDate(a.poly_PolygonDateTime) + "<br>" +
          "<strong>Perimeter created:</strong> " +
          formatHistoricalDate(a.poly_CreateDate) + "<br>" +
          "<strong>Perimeter current as of:</strong> " +
          formatHistoricalDate(a.poly_DateCurrent) + "<br>" +
          "<strong>Initial latitude:</strong> " +
          escapeHtml(formatHistoricalCoordinate(a.attr_InitialLatitude)) +
          "<br>" +
          "<strong>Initial longitude:</strong> " +
          escapeHtml(formatHistoricalCoordinate(a.attr_InitialLongitude)) +
          "<br>" +
          "<strong>Percent contained:</strong> " +
          (
            a.attr_PercentContained == null
              ? "Not reported"
              : escapeHtml(a.attr_PercentContained) + "%"
          ) + "<br>" +
          "<strong>Containment date:</strong> " +
          formatHistoricalDateTime(a.attr_ContainmentDateTime) + "<br>" +
          "<strong>Fire out date:</strong> " +
          formatHistoricalDateTime(a.attr_FireOutDateTime) +
          "</div>";

        polygon.bindPopup(popup);
        polygon.addTo(replacementLayer);
      });

      if (sequence !== historicalRequestSequence || !map.hasLayer(historicalFirePerimeterLayer)) return;
      historicalFirePerimeterLayer.clearLayers();
      replacementLayer.eachLayer(function (layer) {
        layer.addTo(historicalFirePerimeterLayer);
      });
      historicalLastViewKey = viewKey;
      console.info("Historical perimeters in visible map extent:", features.length);
    } catch (error) {
      if (error.name !== "AbortError") {
        console.error("Could not refresh historical fire perimeters:", error);
      }
    } finally {
      if (sequence === historicalRequestSequence) historicalAbortController = null;
    }
  }

  function scheduleHistoricalPerimeterRefresh() {
    if (!map.hasLayer(historicalFirePerimeterLayer)) return;
    clearTimeout(historicalRefreshTimer);
    historicalRefreshTimer = setTimeout(updateHistoricalFirePerimeters, 300);
  }

  // =========================================================
  // RAWS WEATHER STATIONS
  // Active Oregon stations in Jackson and Josephine counties
  // =========================================================

  const rawsQueryUrl =
    "https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/PublicView_RAWS/FeatureServer/1/query";

  const rawsLayer = L.layerGroup().addTo(map);
  let rawsRefreshInProgress = false;

  function rawsValue(value, suffix) {
    if (
      value == null ||
      String(value).trim() === "" ||
      String(value).trim().toUpperCase() === "NO DATA"
    ) {
      return "Not reported";
    }

    return escapeHtml(String(value).trim()) + (suffix || "");
  }

  function rawsTemperature(value) {
    if (
      value == null ||
      String(value).trim() === "" ||
      String(value).trim().toUpperCase() === "NO DATA"
    ) {
      return "Not reported";
    }

    const temperature = String(value)
      .trim()
      .replace(/ deg\. F/i, "")
      .replace(/°\s*F/i, "")
      .trim();

    return escapeHtml(temperature) + "F";
  }

  function rawsWindDirection(value) {
    if (
      value == null ||
      String(value).trim() === "" ||
      String(value).trim().toUpperCase() === "NO DATA"
    ) {
      return "Not reported";
    }

    const degrees = Number(value);

    if (!Number.isFinite(degrees)) {
      return rawsValue(value, "");
    }

    const directions = [
      "N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
      "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"
    ];

    const compass = directions[
      Math.round((((degrees % 360) + 360) % 360) / 22.5) % 16
    ];

    return compass + " (" + degrees + "°)";
  }

  function rawsObservationTime(value) {
    if (value == null || value === "") return "Not reported";

    const timestamp = Number(value);

    if (
      !Number.isFinite(timestamp) ||
      timestamp <= 0 ||
      timestamp < Date.UTC(2000, 0, 1)
    ) {
      return "Not reported";
    }

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Not reported";

    return escapeHtml(date.toLocaleString());
  }

  async function updateRawsStations() {
    if (rawsRefreshInProgress || !map.hasLayer(rawsLayer)) return;

    rawsRefreshInProgress = true;

    const params = new URLSearchParams({
      where: "Status = 'A' AND State = 'OR'",
      outFields:
        "StationName,ObservedDate,Elevation,Latitude,Longitude," +
        "State,County,Status,RainAccumulation,WindSpeedMPH," +
        "WindDirDegrees,AirTempStandPlace,RelativeHumidity," +
        "WindSpeedPeak,WindDirPeak,StationID,MesoWestStationID," +
        "WXID,MesoWestURL",
      outSR: "4326",
      returnGeometry: "true",
      f: "json"
    });

    try {
      const response = await fetch(
        rawsQueryUrl + "?" + params.toString()
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error.message || "RAWS query failed");
      }

      const replacementLayer = L.layerGroup();
      const features = Array.isArray(data.features) ? data.features : [];

      features.forEach(function (feature) {
        const a = feature.attributes || {};
        const g = feature.geometry || {};

        const lat = Number(g.y != null ? g.y : a.Latitude);
        const lng = Number(g.x != null ? g.x : a.Longitude);

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng) ||
          lat < -90 || lat > 90 ||
          lng < -180 || lng > 180 ||
          (lat === 0 && lng === 0)
        ) return;

        const tempText = rawsTemperature(a.AirTempStandPlace);

        const marker = L.marker([lat, lng], {
          icon: L.divIcon({
            className: "",
            html: `
              <div style="display:flex;align-items:center;gap:3px;white-space:nowrap;">
                <div style="
                  width:12px;
                  height:12px;
                  flex-shrink:0;
                  background:#008CFF;
                  border:2px solid white;
                  box-shadow:0 1px 4px #555;
                  box-sizing:border-box;
                "></div>
                <span style="
                  color:#111;
                  background:rgba(255,255,255,0.9);
                  padding:1px 3px;
                  border-radius:3px;
                  font-size:12px;
                  font-weight:bold;
                ">${tempText}</span>
              </div>
            `,
            iconSize: [150, 18],
            iconAnchor: [6, 9]
          })
        });

        let popup =
          "<div style='min-width:210px;max-width:270px;line-height:1.5'>" +
          "<strong style='font-size:15px'>" +
          escapeHtml(a.StationName || "Unnamed RAWS station") +
          "</strong><br>" +
          "<span style='color:#555'>" +
          escapeHtml(a.County || "Oregon") + " County RAWS</span>" +
          "<hr style='margin:6px 0'>" +
          "<strong>Temperature:</strong> " +
          rawsTemperature(a.AirTempStandPlace) + "<br>" +
          "<strong>Relative humidity:</strong> " +
          rawsValue(a.RelativeHumidity, "").replace(/\s*%$/, "") +
          (a.RelativeHumidity == null ||
           String(a.RelativeHumidity).trim() === "" ||
           String(a.RelativeHumidity).trim().toUpperCase() === "NO DATA"
            ? ""
            : "%") + "<br>" +
          "<strong>Wind:</strong> " +
          rawsValue(a.WindSpeedMPH, "") + " · " +
          rawsWindDirection(a.WindDirDegrees) + "<br>" +
          "<strong>Peak wind:</strong> " +
          rawsValue(a.WindSpeedPeak, "") + " · " +
          rawsWindDirection(a.WindDirPeak) + "<br>" +
          "<strong>Rain accumulation:</strong> " +
          rawsValue(a.RainAccumulation, "") + "<br>" +
          "<strong>Elevation:</strong> " +
          rawsValue(a.Elevation, " ft") + "<br>" +
          "<strong>Observation:</strong> " +
          rawsObservationTime(a.ObservedDate);

        if (a.MesoWestURL) {
          const weatherUrl = String(a.MesoWestURL);

          if (/^https:\/\/[^\s"'<>]+$/i.test(weatherUrl)) {
            popup +=
              "<br><a href='" + escapeHtml(weatherUrl) +
              "' target='_blank' rel='noopener noreferrer'>" +
              "Detailed station weather</a>";
          }
        }

        popup += "</div>";

        marker.bindPopup(popup);
        marker.addTo(replacementLayer);
      });

      rawsLayer.clearLayers();

      replacementLayer.eachLayer(function (layer) {
        layer.addTo(rawsLayer);
      });

      console.info(
        "Active Jackson/Josephine RAWS stations loaded:",
        features.length
      );

    } catch (error) {
      console.error("Could not refresh RAWS weather stations:", error);
    } finally {
      rawsRefreshInProgress = false;
    }
  }

  updateRawsStations();
  setInterval(updateRawsStations, 15 * 60 * 1000);

  // =========================================================
  // USGS LAKES & PONDS
  //
  // featuretype = 3: Lake
  // Minimum size = 0.25 acre
  // Statewide, visible map extent at zoom 9+
  // Only fetch waterbody geometry for the current map view
  // =========================================================

  const usgsWaterbodyQueryUrl =
    "https://3dhp.nationalmap.gov/arcgis/rest/services/usgs_3dhp_all/FeatureServer/60/query";

  const oregonCountyQueryUrl =
    "https://gis.wrd.state.or.us/server/rest/services/adm/Counties_WGS84/FeatureServer/0/query";

  // 0.25 acre converted to square kilometers.
  const waterbodyMinimumAreaSqKm = 0.0010117;

  const waterbodyWhere =
    "featuretype = 3 AND areasqkm >= " +
    waterbodyMinimumAreaSqKm;

  const usgsWaterbodyLayer = L.layerGroup();

  let waterbodyRefreshSequence = 0;
  let waterbodyRefreshTimer = null;
  let waterbodyLastViewKey = "";
  let waterbodyAbortController = null;

  function formatWaterbodyAcres(areaSqKm) {
    const squareKm = Number(areaSqKm);

    if (!Number.isFinite(squareKm) || squareKm < 0) {
      return "Not reported";
    }

    const acres = squareKm * 247.105381;

    return acres.toLocaleString(undefined, {
      maximumFractionDigits: 2
    }) + " acres";
  }

  function formatWaterbodyDate(value) {
    if (value == null || value === "") return "Not reported";

    const timestamp = Number(value);

    if (!Number.isFinite(timestamp)) return "Not reported";

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Not reported";

    return escapeHtml(date.toLocaleDateString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric"
    }));
  }

  function waterbodyPopup(attributes) {
    const name =
      attributes.gnisidlabel ||
      attributes.id3dhp ||
      "Unnamed lake or pond";

    const type = attributes.featuretypelabel || "Lake";

    return (
      "<div style='min-width:190px;max-width:260px;line-height:1.5'>" +
      "<strong style='font-size:15px'>" +
      escapeHtml(name) +
      "</strong><br>" +
      "<span style='color:#1769d2;font-weight:bold'>" +
      "USGS Waterbody</span><br>" +
      "<strong>Type:</strong> " +
      escapeHtml(type) + "<br>" +
      "<strong>Mapped area:</strong> " +
      escapeHtml(formatWaterbodyAcres(attributes.areasqkm)) + "<br>" +
      "<strong>Feature ID:</strong> " +
      escapeHtml(attributes.id3dhp) + "<br>" +
      "<strong>Feature date:</strong> " +
      formatWaterbodyDate(attributes.featuredate) +
      "</div>"
    );
  }

  function addWaterbodyFeature(feature, targetLayer) {
    const attributes = feature.attributes || {};
    const geometry = feature.geometry || {};
    const rings = Array.isArray(geometry.rings) ? geometry.rings : [];

    if (!rings.length) return;

    const latLngRings = rings.map(function (ring) {
      return ring.map(function (point) {
        return [Number(point[1]), Number(point[0])];
      });
    });

    if (!latLngRings[0] || latLngRings[0].length < 3) return;

    const polygon = L.polygon(latLngRings, {
      color: "#1769d2",
      weight: 1.5,
      opacity: 0.95,
      fillColor: "#42a5f5",
      fillOpacity: 0.55
    });

    polygon.bindPopup(waterbodyPopup(attributes));
    polygon.addTo(targetLayer);
  }

  function currentWaterbodyViewKey() {
    const bounds = map.getBounds();

    // Rounded key avoids needless requests for tiny movement differences.
    return [
      bounds.getWest().toFixed(5),
      bounds.getSouth().toFixed(5),
      bounds.getEast().toFixed(5),
      bounds.getNorth().toFixed(5),
      map.getZoom()
    ].join(",");
  }

  async function updateWaterbodiesInView() {
    if (!map.hasLayer(usgsWaterbodyLayer)) return;
    if (map.getZoom() < 9) {
      waterbodyRefreshSequence++;
      if (waterbodyAbortController) waterbodyAbortController.abort();
      waterbodyAbortController = null;
      waterbodyLastViewKey = "";
      usgsWaterbodyLayer.clearLayers();
      return;
    }
    const viewKey = currentWaterbodyViewKey();
    if (viewKey === waterbodyLastViewKey) return;
    const sequence = ++waterbodyRefreshSequence;
    if (waterbodyAbortController) waterbodyAbortController.abort();
    const controller = new AbortController();
    waterbodyAbortController = controller;
    const bounds = map.getBounds();
    const geometry = JSON.stringify({xmin: bounds.getWest(), ymin: bounds.getSouth(),
      xmax: bounds.getEast(), ymax: bounds.getNorth(), spatialReference: {wkid:4326}});
    const base = {
      where: waterbodyWhere, geometry, geometryType: "esriGeometryEnvelope", inSR: "4326",
      spatialRel: "esriSpatialRelIntersects",
      outFields: "OBJECTID,id3dhp,gnisidlabel,featuretype,featuretypelabel,areasqkm,featuredate",
      returnGeometry: "true", outSR: "4326", orderByFields: "OBJECTID ASC",
      resultRecordCount: "1000", f: "json"
    };
    try {
      const replacementLayer = L.layerGroup();
      const loadedIds = new Set();
      for (let offset = 0; ; offset += 1000) {
        const response = await fetch(usgsWaterbodyQueryUrl, {
          method: "POST", signal: controller.signal,
          headers: {"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
          body: new URLSearchParams({...base, resultOffset: String(offset)}).toString()
        });
        if (!response.ok) throw Error("Waterbody HTTP " + response.status);
        const data = await response.json();
        if (data.error) throw Error(data.error.message || "Waterbody query failed");
        if (sequence !== waterbodyRefreshSequence || !map.hasLayer(usgsWaterbodyLayer) || map.getZoom() < 9) return;
        const page = Array.isArray(data.features) ? data.features : [];
        page.forEach(feature => {
          const id = feature.attributes && feature.attributes.OBJECTID;
          if (id != null && loadedIds.has(id)) return;
          if (id != null) loadedIds.add(id);
          addWaterbodyFeature(feature, replacementLayer);
        });
        if (!page.length || (!data.exceededTransferLimit && page.length < 1000)) break;
      }
      usgsWaterbodyLayer.clearLayers();
      replacementLayer.eachLayer(layer => layer.addTo(usgsWaterbodyLayer));
      waterbodyLastViewKey = viewKey;
      console.info("Oregon lakes and ponds in view:", loadedIds.size);
    } catch(error) {
      if (error.name !== "AbortError") console.error("Could not load USGS waterbodies:", error);
    } finally {
      if (sequence === waterbodyRefreshSequence) waterbodyAbortController = null;
    }
  }

  function scheduleWaterbodyRefresh() {
    if (!map.hasLayer(usgsWaterbodyLayer)) return;

    clearTimeout(waterbodyRefreshTimer);

    waterbodyRefreshTimer = setTimeout(function () {
      updateWaterbodiesInView();
    }, 300);
  }



  // =========================================================
  // GPS TRACK — SEPARATE SEGMENT FOR EACH GPS SESSION
  // =========================================================

  // Visible by default. Layer visibility does not control recording.
  const gpsTrackLayer = L.layerGroup().addTo(map);

  const gpsTrackStyle = {
    color: "#00a6ff",
    weight: 5,
    opacity: 0.9,
    lineCap: "round",
    lineJoin: "round"
  };

  // Persist short GPS segments locally. Storage is optional: GPS still works if blocked.
  const GPS_DB_NAME = "topotac-gps-tracks";
  const GPS_DB_STORE = "segments";
  let gpsDb = null;
  let gpsDbReady = false;
  let gpsStorageWarningShown = false;
  let gpsSegmentId = null;
  let gpsLastFixTime = 0;
  let gpsWriteQueue = Promise.resolve();
  let gpsTrackGeneration = 0;
  const GPS_GAP_MS = 60000;

  function warnGpsStorage(err) {
    console.warn("GPS track local storage unavailable:", err);
    if (!gpsStorageWarningShown) {
      gpsStorageWarningShown = true;
      const note = document.createElement("div");
      note.textContent = "GPS tracks are temporary: browser storage unavailable.";
      note.setAttribute("role", "status");
      note.style.cssText = "position:absolute;bottom:245px;right:8px;z-index:1200;background:#fff4dd;color:#3a2500;padding:9px;border:1px solid #bd8d31;border-radius:5px;max-width:220px;font:12px Arial";
      document.body.appendChild(note);
    }
  }

  function openGpsDb() {
    if (!window.indexedDB) { warnGpsStorage("IndexedDB unsupported"); return Promise.resolve(null); }
    return new Promise(resolve => {
      let request;
      try { request = indexedDB.open(GPS_DB_NAME, 1); }
      catch (err) { warnGpsStorage(err); resolve(null); return; }
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(GPS_DB_STORE)) db.createObjectStore(GPS_DB_STORE, {keyPath:"id"});
      };
      request.onsuccess = () => { gpsDb = request.result; gpsDbReady = true; resolve(gpsDb); };
      request.onerror = () => { warnGpsStorage(request.error); resolve(null); };
      request.onblocked = () => { warnGpsStorage("Database upgrade blocked"); resolve(null); };
    });
  }

  function gpsDbOperation(mode, action) {
    return new Promise((resolve, reject) => {
      if (!gpsDbReady || !gpsDb) { resolve(null); return; }
      try {
        const tx = gpsDb.transaction(GPS_DB_STORE, mode);
        const store = tx.objectStore(GPS_DB_STORE);
        const req = action(store);
        tx.oncomplete = () => resolve(req ? req.result : true);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      } catch(err) { reject(err); }
    });
  }

  // Restore before recording new positions, so asynchronous reads never overwrite them.
  const gpsRestorePromise = openGpsDb().then(async db => {
    if (!db) return;
    const generation = gpsTrackGeneration;
    try {
      const records = await gpsDbOperation("readonly", store => store.getAll());
      if (generation !== gpsTrackGeneration) return;
      for (const record of (records || [])) {
        if (!Array.isArray(record.points) || !record.points.length) continue;
        L.polyline(record.points, gpsTrackStyle).addTo(gpsTrackLayer);
      }
    } catch(err) { warnGpsStorage(err); }
  });

  function saveGpsSegment() {
    if (!gpsSegmentId || !gpsTrackPoints.length) return;
    const record = {id:gpsSegmentId, points:gpsTrackPoints.map(p => [p.lat,p.lng])};
    const generation = gpsTrackGeneration;
    gpsWriteQueue = gpsWriteQueue.then(async () => {
      await gpsRestorePromise;
      if (generation !== gpsTrackGeneration) return;
      await gpsDbOperation("readwrite", store => store.put(record));
    }).catch(warnGpsStorage);
  }

  // Each GPS session gets its own polyline.
  let gpsTrackLine = null;
  let gpsTrackPoints = [];

  function recordGpsTrackPoint(location) {
    // Create a new line when a session starts or restarts.
    const fixTime = Date.now();
    if (gpsTrackLine && gpsLastFixTime && fixTime - gpsLastFixTime > GPS_GAP_MS) endGpsTrackSegment();
    gpsLastFixTime = fixTime;
    if (!gpsTrackLine) {
      gpsSegmentId = "segment-" + fixTime + "-" + Math.random().toString(36).slice(2);
      gpsTrackPoints = [];
      gpsTrackLine = L.polyline([], gpsTrackStyle);
      gpsTrackLine.addTo(gpsTrackLayer);
    }

    const previousPoint =
      gpsTrackPoints.length > 0
        ? gpsTrackPoints[gpsTrackPoints.length - 1]
        : null;

    // Ignore duplicate consecutive positions.
    if (
      !previousPoint ||
      previousPoint.lat !== location.lat ||
      previousPoint.lng !== location.lng
    ) {
      gpsTrackPoints.push(location);
      gpsTrackLine.setLatLngs(gpsTrackPoints);
      saveGpsSegment();
    }
  }

  // End the current segment without deleting its line.
  function endGpsTrackSegment() {
    gpsTrackLine = null;
    gpsTrackPoints = [];
    gpsSegmentId = null;
    gpsLastFixTime = 0;
  }

  const clearTrackButton =
    document.getElementById("clearTrackButton");

  L.DomEvent.disableClickPropagation(clearTrackButton);
  L.DomEvent.disableScrollPropagation(clearTrackButton);

  clearTrackButton.addEventListener("click", function () {
    // Delete every segment, including earlier GPS sessions.
    gpsTrackGeneration++;
    gpsTrackLayer.clearLayers();
    gpsWriteQueue = gpsWriteQueue.then(async () => {
      await gpsRestorePromise;
      await gpsDbOperation("readwrite", store => store.clear());
    }).catch(warnGpsStorage);

    // If GPS is still on, the next position starts a fresh line.
    endGpsTrackSegment();
  });


  document.addEventListener("visibilitychange", () => {
    if (document.hidden) endGpsTrackSegment();
  });
  window.addEventListener("pagehide", endGpsTrackSegment);

  // =========================================================
  // GPX IMPORT LAYER
  // =========================================================

  // Master checkbox; its behavior is handled below.
  const gpxTrackLayer = L.layerGroup();
  const gpxOverlayLayers = [];

  const markedPointsLayer = L.layerGroup().addTo(map);

  // Oregon dog parks: static GeoJSON hosted beside index.html.
  // Load once, on first checkbox activation; no Overpass requests.
  const oregonDogParksLayer = L.layerGroup();
  let oregonDogParksPromise = null;
  function dogParkEscape(value) {
    return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
  }
  function loadOregonDogParks() {
    if (oregonDogParksPromise) return oregonDogParksPromise;
    oregonDogParksPromise = fetch("oregon_dogparks.geojson")
      .then(response => {
        if (!response.ok) throw new Error("GeoJSON HTTP " + response.status);
        return response.json();
      })
      .then(data => {
        if (data.type !== "FeatureCollection" || !Array.isArray(data.features)) {
          throw new Error("Invalid dog park GeoJSON");
        }
        const parks = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
            radius: 7, color: "#ffffff", weight: 2,
            fillColor: "#9333ea", fillOpacity: 0.95
          }),
          onEachFeature: (feature, layer) => {
            const p = feature.properties || {};
            const name = dogParkEscape(p.name || "Unnamed Dog Park");
            let popup = "<strong>" + name + "</strong><br>Oregon Dog Park";
            if (p.operator) popup += "<br>Operator: " + dogParkEscape(p.operator);
            if (p.access) popup += "<br>Access: " + dogParkEscape(p.access);
            if (p.dog) popup += "<br>Dog access: " + dogParkEscape(p.dog);
            if (p.website && /^https?:\/\//i.test(p.website)) {
              const url = dogParkEscape(p.website);
              popup += '<br><a href="' + url + '" target="_blank" rel="noopener noreferrer">Park website</a>';
            }
            layer.bindPopup(popup);
          }
        });
        parks.addTo(oregonDogParksLayer);
        console.info("OR Dog Parks loaded:", data.features.length);
      })
      .catch(error => {
        oregonDogParksPromise = null; // allow retry on next enable
        console.error("OR Dog Parks GeoJSON failed to load:", error);
        if (map.hasLayer(oregonDogParksLayer)) {
          alert("OR Dog Parks could not load. Check that oregon_dogparks.geojson is beside index.html.");
        }
      });
    return oregonDogParksPromise;
  }

  // =========================================================
  // LAYER MENU
  // =========================================================

  const layerControl = L.control.layers(
    {
      "Esri Street Map": streetMap,
      "OpenTopoMap": topoMap,
      "Esri Aerial Imagery": aerialMap
    },
    {
      "OR LiDAR": hillshade,
      "OR Public Land": publicLand,
      "OR TRS": plss,
      "OR Tax Lots": taxlots,
      "OR New Fires (24Hr)": nifcFireLayer,
      "US Current Fires": firePerimeterLayer,
      "OR Historical Fires": historicalFirePerimeterLayer,
      "OR RAWS WX": rawsLayer,
      "Lakes/Ponds ¼ Acre+": usgsWaterbodyLayer,
      "GPS Tracks": gpsTrackLayer,
      "Marked Points": markedPointsLayer,
      "OR Dog Parks": oregonDogParksLayer
    },
    {
      collapsed: true,
      position: "topright"
    }
  ).addTo(map);

  // =========================================================
  // GPX IMPORT — local files, rendered as a separate map layer
  // Files are read in this browser only; they are not uploaded.
  // =========================================================

  const gpxFileInput = document.getElementById("gpxFileInput");
  const gpxImportButton = document.getElementById("gpxImportButton");
  const clearGpxButton = document.getElementById("clearGpxButton");
  const gpxStatus = document.getElementById("gpxStatus");
  let gpxTrackCount = 0;
  const gpxColors = [
    "#7b2cbf", "#0077b6", "#d97706", "#008148",
    "#c1121f", "#5a189a", "#0f766e", "#c026d3"
  ];

  function showGpxStatus(message, show) {
    gpxStatus.textContent = message;
    gpxStatus.style.display = show === false ? "none" : "block";
  }

  function gpxText(node, tagName) {
    const child = node.getElementsByTagName(tagName)[0];
    return child ? child.textContent.trim() : "";
  }

  function gpxPointFromNode(node) {
    const lat = Number(node.getAttribute("lat"));
    const lon = Number(node.getAttribute("lon"));
    if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
        lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      return null;
    }
    return L.latLng(lat, lon);
  }

  function gpxDistanceMeters(points) {
    let distance = 0;
    for (let i = 1; i < points.length; i++) {
      distance += points[i - 1].distanceTo(points[i]);
    }
    return distance;
  }

  function formatGpxDistance(meters) {
    const miles = meters / 1609.344;
    if (miles < 0.1) return Math.round(meters) + " m";
    return miles.toFixed(2) + " mi";
  }

  function makeGpxEndpointIcon(kind) {
    return L.divIcon({
      className: "",
      html: '<div class="gpx-' + kind + '-marker"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
  }

  async function addGpxFile(file) {
    const text = await file.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "application/xml");

    if (xml.getElementsByTagName("parsererror").length) {
      throw new Error("That file is not valid GPX/XML.");
    }
    const root = xml.documentElement;
    if (!root || root.localName.toLowerCase() !== "gpx") {
      throw new Error("That file does not appear to be a GPX file.");
    }

    const fileName = file.name || "Imported GPX";
    const trackName = gpxText(xml, "name") ||
      fileName.replace(/\.gpx$/i, "");
    const color = gpxColors[gpxTrackCount % gpxColors.length];
    const thisFileLayer = L.layerGroup();
    const allPoints = [];
    let lineCount = 0;

    // Keep separate track segments separate; don't draw across gaps.
    Array.from(xml.getElementsByTagName("trkseg")).forEach(function (segment) {
      const points = Array.from(segment.getElementsByTagName("trkpt"))
        .map(gpxPointFromNode).filter(Boolean);
      if (points.length < 2) return;

      L.polyline(points, {
        color: color, weight: 4, opacity: 0.9,
        lineCap: "round", lineJoin: "round"
      }).addTo(thisFileLayer);

      allPoints.push.apply(allPoints, points);
      lineCount++;
    });

    // Also support GPX route files that use rtept instead of trkpt.
    if (lineCount === 0) {
      Array.from(xml.getElementsByTagName("rte")).forEach(function (route) {
        const points = Array.from(route.getElementsByTagName("rtept"))
          .map(gpxPointFromNode).filter(Boolean);
        if (points.length < 2) return;

        L.polyline(points, {
          color: color, weight: 4, opacity: 0.9,
          lineCap: "round", lineJoin: "round", dashArray: "7 5"
        }).addTo(thisFileLayer);

        allPoints.push.apply(allPoints, points);
        lineCount++;
      });
    }

    // Add named waypoints if the GPX contains them.
    Array.from(xml.getElementsByTagName("wpt")).forEach(function (node) {
      const point = gpxPointFromNode(node);
      if (!point) return;
      const name = gpxText(node, "name") || "Waypoint";
      L.marker(point).bindPopup(
        "<strong>" + escapeHtml(name) + "</strong><br>GPX waypoint"
      ).addTo(thisFileLayer);
    });

    if (!allPoints.length) {
      throw new Error("No usable track or route points were found in " + fileName + ".");
    }

    const firstPoint = allPoints[0];
    const lastPoint = allPoints[allPoints.length - 1];
    L.marker(firstPoint, { icon: makeGpxEndpointIcon("start") })
      .bindPopup("<strong>Start</strong><br>" + escapeHtml(trackName))
      .addTo(thisFileLayer);
    L.marker(lastPoint, { icon: makeGpxEndpointIcon("end") })
      .bindPopup("<strong>End</strong><br>" + escapeHtml(trackName))
      .addTo(thisFileLayer);

    const distance = gpxDistanceMeters(allPoints);
   // Display this imported file immediately and track it
   // separately so its own checkbox works independently.
   thisFileLayer.addTo(map);
   gpxOverlayLayers.push(thisFileLayer);
   gpxTrackCount++;

    layerControl.addOverlay(
      thisFileLayer,
      escapeHtml(trackName) + " (" + formatGpxDistance(distance) + ")"
    );

    const bounds = L.latLngBounds(allPoints);
    if (bounds.isValid()) map.fitBounds(bounds.pad(0.08), { maxZoom: 16 });

    return trackName + ": " + allPoints.length + " points, " +
      formatGpxDistance(distance);
  }

  gpxImportButton.addEventListener("click", function () {
    gpxFileInput.click();
  });

  gpxFileInput.addEventListener("change", async function () {
    const files = Array.from(gpxFileInput.files || []);
    if (!files.length) return;

    const messages = [];
    showGpxStatus("Loading GPX file(s)…");

    for (const file of files) {
      try {
        messages.push(await addGpxFile(file));
      } catch (error) {
        messages.push((file.name || "GPX file") + ": " +
          (error && error.message ? error.message : "Could not import file."));
      }
    }

    showGpxStatus(messages.join(" | "));
    gpxFileInput.value = "";
  });

clearGpxButton.addEventListener("click", function () {
    // Remove every imported GPX track from the map and layer menu.
    gpxOverlayLayers.forEach(function (layer) {
        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

        layerControl.removeLayer(layer);
    });

    // Empty the list of imported GPX layers.
    gpxOverlayLayers.length = 0;
    gpxTrackCount = 0;

    // Update the status message.
    showGpxStatus("Imported GPX tracks cleared.");
});

  L.DomEvent.disableClickPropagation(gpxImportButton);
  L.DomEvent.disableClickPropagation(clearGpxButton);
  L.DomEvent.disableClickPropagation(gpxStatus);

  map.on("overlayadd", function (event) {
    if (event.layer === oregonDogParksLayer) loadOregonDogParks();

    if (event.layer === hillshade) updateHillshade();
    if (event.layer === publicLand) updatePublicLand();
    if (event.layer === plss) updatePLSS();
    if (event.layer === taxlots) updateTaxlots();
    if (event.layer === nifcFireLayer) updateNifcFires();
    if (event.layer === firePerimeterLayer) updateFirePerimeters();

    if (event.layer === historicalFirePerimeterLayer) {
      updateHistoricalFirePerimeters();
    }

    if (event.layer === rawsLayer) {
      updateRawsStations();
    }

    if (event.layer === usgsWaterbodyLayer) {
      waterbodyLastViewKey = "";
      updateWaterbodiesInView();
    }
  });

  map.on("overlayremove", function (event) {
    if (event.layer === firePerimeterLayer) {
      clearTimeout(currentRefreshTimer);
      currentRequestSequence++;
      if (currentAbortController) currentAbortController.abort();
      currentAbortController = null;
      currentLastViewKey = "";
    }

    if (event.layer === historicalFirePerimeterLayer) {
      clearTimeout(historicalRefreshTimer);
      historicalRequestSequence++;
      if (historicalAbortController) historicalAbortController.abort();
      historicalAbortController = null;
      historicalLastViewKey = "";
    }
    if (event.layer === taxlots) { taxlotRequest++; parcelClickSequence++; }
    if (event.layer === publicLand) {
      publicLandRequest++;
    }


    if (event.layer === usgsWaterbodyLayer) {
      // Ignore any older request that finishes after the layer is turned off.
      waterbodyRefreshSequence++;
      if (waterbodyAbortController) waterbodyAbortController.abort();
      waterbodyAbortController = null;
      waterbodyLastViewKey = "";
      clearTimeout(waterbodyRefreshTimer);
    }
  });

  map.on("moveend", refreshVisibleOverlays);
  map.on("zoomend", refreshVisibleOverlays);
  map.on("resize", refreshVisibleOverlays);

  if (typeof ResizeObserver !== "undefined") {
    const observer = new ResizeObserver(function () {
      map.invalidateSize({ pan: false });
      refreshVisibleOverlays();
    });

    observer.observe(document.getElementById("map"));
  }

  // =========================================================
  // DOGAMI OPACITY SLIDER
  // =========================================================

  const opacitySlider = document.getElementById("opacitySlider");
  const opacityValue = document.getElementById("opacityValue");

  L.DomEvent.disableClickPropagation(
    document.getElementById("opacityControl")
  );

  opacitySlider.addEventListener("input", function () {
    const opacity = Number(opacitySlider.value) / 100;

    hillshade.setOpacity(opacity);
    opacityValue.textContent = opacitySlider.value + "%";
  });

  // =========================================================
  // COORDINATES — DEGREES AND DECIMAL MINUTES ONLY
  // Negative values indicate south or west.
  // =========================================================

  function toDDM(value) {
    const sign = value < 0 ? "-" : "";
    const absolute = Math.abs(value);
    const degrees = Math.floor(absolute);
    const minutes = (absolute - degrees) * 60;

    return sign + degrees + "° " + minutes.toFixed(3) + "'";
  }

  const coordinatesDisplay =
    document.getElementById("coordinates");

  const gpsCoordinatesDisplay =
    document.getElementById("gpsCoordinates");

  map.on("click", function (event) {
    if (Date.now() < suppressPointClicksUntil ||
        (event.originalEvent && event.originalEvent.target.closest &&
         event.originalEvent.target.closest(".leaflet-popup"))) return;
    coordinatesDisplay.textContent =
      toDDM(event.latlng.lat) + "  " +
      toDDM(event.latlng.lng);
    if (pointPlacementActive) {
      addMarkedPoint(event.latlng.lat, event.latlng.lng);
    } else {
      identifyClickedParcel(event.latlng);
    }
  });


  // =========================================================
  // MARKED POINTS — persistent user-created waypoints
  // =========================================================
  const pointStorageKey = "topotac.markedPoints.v1";
  const addPointButton = document.getElementById("addPointButton");
  const clearPointsButton = document.getElementById("clearPointsButton");
  const enterCoordsButton = document.getElementById("enterCoordsButton");
  const pointEntryPanel = document.getElementById("pointEntryPanel");
  const pointFormat = document.getElementById("pointFormat");
  const pointLat = document.getElementById("pointLat");
  const pointLng = document.getElementById("pointLng");
  const pointName = document.getElementById("pointName");
  const pointEntryError = document.getElementById("pointEntryError");
  let pointPlacementActive = false;
  let suppressPointClicksUntil = 0;
  function blockDialogClickThrough() { suppressPointClicksUntil = Date.now() + 650; }
  let markedPoints = [];
  let nextPointId = 1;
  const pointMarkers = new Map();

  function saveMarkedPoints() {
    try { localStorage.setItem(pointStorageKey, JSON.stringify({points:markedPoints,nextId:nextPointId})); }
    catch (err) { console.warn("Marked points could not be saved:", err); }
  }
  function pointPopup(p) {
    const name = p.name ? "<strong>"+escapeHtml(p.name)+"</strong><br>" : "";
    return '<div style="min-width:190px;line-height:1.6">'+name+
      '<strong>Point '+p.id+'</strong><br>'+
      toDDM(Math.abs(p.lat))+(p.lat>=0?' N':' S')+', '+toDDM(Math.abs(p.lng))+(p.lng>=0?' E':' W')+'<br>'+
      p.lat.toFixed(6)+', '+p.lng.toFixed(6)+'<br>'+
      '<button type="button" data-point-action="copy" data-point-id="'+p.id+'">COPY</button> '+
      '<button type="button" data-point-action="rename" data-point-id="'+p.id+'">RENAME</button> '+
      '<button type="button" data-point-action="delete" data-point-id="'+p.id+'">DELETE POINT</button>'+
      '<br><small>Drag marker to move</small></div>';
  }
  function renderMarkedPoint(p) {
    const icon = L.divIcon({className:"",html:'<div class="marked-point-pin">'+p.id+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
    const marker = L.marker([p.lat,p.lng],{icon,draggable:true,bubblingMouseEvents:false});
    marker.bindPopup(pointPopup(p));
    marker.on("dragend", () => {
      const pos = marker.getLatLng();
      p.lat=pos.lat; p.lng=pos.lng;
      marker.setPopupContent(pointPopup(p));
      saveMarkedPoints();
    });
    pointMarkers.set(p.id,marker);
    markedPointsLayer.addLayer(marker);
    return marker;
  }
  function addMarkedPoint(lat,lng,name="") {
    if (!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return;
    const p={id:nextPointId++,lat,lng,name};
    markedPoints.push(p);
    const marker=renderMarkedPoint(p);
    if (!map.hasLayer(markedPointsLayer)) markedPointsLayer.addTo(map);
    saveMarkedPoints();
    marker.openPopup();
    return marker;
  }
  try {
    const stored=JSON.parse(localStorage.getItem(pointStorageKey)||"null");
    if (stored && Array.isArray(stored.points)) {
      markedPoints=stored.points.filter(p=>Number.isSafeInteger(p.id)&&p.id>0&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180).map(p=>({id:p.id,lat:p.lat,lng:p.lng,name:String(p.name||"").slice(0,80)}));
      nextPointId=Math.max(Number.isSafeInteger(stored.nextId)?stored.nextId:1,1,...markedPoints.map(p=>p.id+1));
      markedPoints.forEach(renderMarkedPoint);
    }
  } catch(err) {console.warn("Could not restore marked points:",err);}
  function setPointMode(active) {
    pointPlacementActive=active;
    addPointButton.setAttribute("aria-pressed",String(active));
    addPointButton.textContent=active?"✓ ADD POINT":"ADD POINT";
    map.getContainer().style.cursor=active?"crosshair":"";
  }
  addPointButton.addEventListener("click",()=>setPointMode(!pointPlacementActive));
  clearPointsButton.addEventListener("click",()=>{
    if (!markedPoints.length) return;
    const confirmed=confirm("Delete all "+markedPoints.length+" marked points?");
    blockDialogClickThrough();
    if (!confirmed) return;
    markedPoints=[];pointMarkers.clear();markedPointsLayer.clearLayers();
    nextPointId=1;saveMarkedPoints();
  });
  enterCoordsButton.addEventListener("click",()=>{pointEntryPanel.hidden=!pointEntryPanel.hidden;pointEntryError.textContent="";});
  document.getElementById("closePointEntry").addEventListener("click",()=>pointEntryPanel.hidden=true);
  pointFormat.addEventListener("change",()=>{
    pointLat.placeholder=pointFormat.value==="dd"?"42.4368":"42° 26.208' N";
    pointLng.placeholder=pointFormat.value==="dd"?"-123.1400":"123° 08.400' W";
  });
  function parsePointCoordinate(input,format,latitude) {
    const s=input.trim().toUpperCase().replace(/[−–]/g,"-");
    if (latitude && /[EW]/.test(s)) return NaN;
    if (!latitude && /[NS]/.test(s)) return NaN;
    if (format==="dd") {
      const match=s.match(/^([+-]?\d+(?:\.\d+)?)\s*([NSEW])?$/);
      if (!match) return NaN;
      let value=Number(match[1]);
      if (match[2]) value=Math.abs(value)*(match[2]==="S"||match[2]==="W"?-1:1);
      return value;
    }
    const match=s.match(/^([+-]?\d{1,3})\s*(?:°|D|\s)\s*(\d+(?:\.\d+)?)\s*(?:'|′|M)?\s*([NSEW])?$/);
    if (!match || Number(match[2])>=60) return NaN;
    const neg=match[3] ? /[SW]/.test(match[3]) : match[1].startsWith("-");
    return (Math.abs(Number(match[1]))+Number(match[2])/60)*(neg?-1:1);
  }
  document.getElementById("placeEnteredPoint").addEventListener("click",()=>{
    const lat=parsePointCoordinate(pointLat.value,pointFormat.value,true);
    const lng=parsePointCoordinate(pointLng.value,pointFormat.value,false);
    if (!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) {
      pointEntryError.textContent="Enter valid latitude (-90 to 90) and longitude (-180 to 180).";
      return;
    }
    const marker=addMarkedPoint(lat,lng,pointName.value.trim());
    map.setView([lat,lng],Math.max(map.getZoom(),14));
    marker.openPopup();
    pointEntryPanel.hidden=true;pointEntryError.textContent="";
    pointName.value="";
  });
  map.on("popupopen",event=>{
    const root=event.popup.getElement();
    if (!root) return;
    L.DomEvent.disableClickPropagation(root);
    root.querySelectorAll("[data-point-action]").forEach(button=>{
      button.addEventListener("click",async(event)=>{
        event.stopPropagation();
        const id=Number(button.dataset.pointId);
        const p=markedPoints.find(x=>x.id===id);
        if (!p) return;
        const action=button.dataset.pointAction;
        if (action==="copy") {
          const coords =
  toDDM(Math.abs(p.lat)) + (p.lat >= 0 ? " N" : " S") +
  ", " +
  toDDM(Math.abs(p.lng)) + (p.lng >= 0 ? " E" : " W");
          try { await navigator.clipboard.writeText(coords);button.textContent="COPIED"; }
          catch(err) { window.prompt("Copy coordinates:",coords); }
        } else if (action==="rename") {
          const name=prompt("Point name:",p.name||"");
          blockDialogClickThrough();
          if (name===null) return;
          p.name=name.trim().slice(0,80);
          pointMarkers.get(id).setPopupContent(pointPopup(p));saveMarkedPoints();
        } else if (action==="delete") {
          const confirmed=confirm("Delete point "+id+"?");
          blockDialogClickThrough();
          if (!confirmed) return;
          markedPoints=markedPoints.filter(x=>x.id!==id);
          markedPointsLayer.removeLayer(pointMarkers.get(id));
          pointMarkers.delete(id);saveMarkedPoints();
        }
      });
    });
  });
  [addPointButton,clearPointsButton,enterCoordsButton,pointEntryPanel].forEach(el=>{
    L.DomEvent.disableClickPropagation(el);
    L.DomEvent.disableScrollPropagation(el);
  });

  // =========================================================
  // PHONE GPS
  // =========================================================

  const gpsButton = document.getElementById("gpsButton");

  let gpsWatchId = null;
  let gpsMarker = null;
  let gpsAccuracy = null;
  let gpsHasCentered = false;

  const gpsIcon = L.divIcon({
    className: "",
    html: '<div class="gps-location-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });

  L.DomEvent.disableClickPropagation(gpsButton);

  function stopGpsTracking() {
    situsRequest++;
    lastSitusPoint = null;
    situsDisplay.textContent = "Situs: GPS off";
  endGpsTrackSegment();
    if (gpsWatchId !== null && navigator.geolocation) {
      navigator.geolocation.clearWatch(gpsWatchId);
    }

    gpsWatchId = null;
    gpsHasCentered = false;

    if (gpsMarker) {
      map.removeLayer(gpsMarker);
      gpsMarker = null;
    }

    if (gpsAccuracy) {
      map.removeLayer(gpsAccuracy);
      gpsAccuracy = null;
    }

    gpsButton.setAttribute("aria-pressed", "false");
    gpsButton.textContent = "◎ GPS";
    gpsButton.title = "Show my phone's GPS location";

    gpsCoordinatesDisplay.textContent =
      "GPS: Off — tap GPS to start";
  }

  function gpsError(error) {
    stopGpsTracking();

    if (error.code === 1) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Permission denied. Allow browser location access, then try again.";
    } else if (error.code === 2) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Could not determine location. Check device location services.";
    } else if (error.code === 3) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Timed out. Tap GPS to try again.";
    } else {
      gpsCoordinatesDisplay.textContent =
        "GPS: Unable to get location.";
    }
  }

  gpsButton.addEventListener("click", function () {
    if (gpsWatchId !== null) {
      stopGpsTracking();
      return;
    }

    if (!("geolocation" in navigator)) {
      gpsCoordinatesDisplay.textContent =
        "GPS: This browser does not support location access.";
      return;
    }

    if (!window.isSecureContext) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Requires a secure HTTPS page. Open the map using HTTPS.";
      return;
    }

    gpsHasCentered = false;

    gpsButton.setAttribute("aria-pressed", "true");
    gpsButton.textContent = "GPS…";
    gpsButton.title = "Stop GPS tracking";

    gpsCoordinatesDisplay.textContent =
      "GPS: Waiting for device location…";

    gpsWatchId = navigator.geolocation.watchPosition(
      function (position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = Math.max(
          0,
          position.coords.accuracy || 0
        );

        const location = L.latLng(lat, lng);

 // Record each new GPS position for the track.

     recordGpsTrackPoint(location);

        if (!gpsAccuracy) {
          gpsAccuracy = L.circle(location, {
            radius: accuracy,
            className: "gps-accuracy-circle",
            interactive: false
          }).addTo(map);
        } else {
          gpsAccuracy.setLatLng(location);
          gpsAccuracy.setRadius(accuracy);
        }

        if (!gpsMarker) {
          gpsMarker = L.marker(location, {
            icon: gpsIcon,
            interactive: false,
            keyboard: false,
            zIndexOffset: 1000
          }).addTo(map);
        } else {
          gpsMarker.setLatLng(location);
        }

        gpsCoordinatesDisplay.textContent =
          "GPS: " + toDDM(lat) + "  " +
          toDDM(lng) +
          "  (±" + Math.round(accuracy) + " m)";

        gpsButton.textContent = "GPS ON";
        updateGpsSitus(lat, lng, false);

        if (!gpsHasCentered) {
          map.setView(
            location,
            Math.max(map.getZoom(), 17)
          );

          gpsHasCentered = true;
        }
      },
      gpsError,
      {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 20000
      }
    );
  });

  // =========================================================
  // INITIAL MAP SIZING
  // =========================================================

  setTimeout(function () {
    map.invalidateSize();
  }, 500);

})();
</script>

</body>
</html>
