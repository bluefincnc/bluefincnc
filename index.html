<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oregon LiDAR Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #e5e5e5;
}

.leaflet-top.leaflet-right {
  top: 10px;
  right: 8px;
}

.leaflet-control-layers {
  max-width: min(230px, calc(100vw - 28px));
  max-height: 48vh;
  overflow-y: auto;
  background: white;
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 14px;
}

.leaflet-control-layers-expanded {
  padding: 10px 12px;
}

.leaflet-control-layers label {
  margin: 6px 0;
}

.leaflet-control-layers-separator {
  margin: 8px 0;
}

/* DOGAMI opacity */
#opacityControl {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1000;
  width: 180px;
  padding: 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
}

#opacityControl input {
  width: 100%;
  margin: 5px 0 8px;
}

#opacityValue, #perimeterOpacityValue {
  font-weight: bold;
}

.opacity-row-label {
  display: block;
  margin-top: 7px;
}

/* Bright red perimeter outline with a subtle glow */
.fire-perimeter-glow {
  filter: drop-shadow(0 0 4px rgba(255, 20, 0, 0.9));
}

/* Coordinate display */
#coordinates {
  position: absolute;
  top: 135px;
  left: 10px;
  z-index: 1000;
  max-width: calc(100vw - 40px);
  padding: 8px 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* Live GPS coordinate display */
#gpsCoordinates {
  position: absolute;
  top: 185px;
  left: 10px;
  z-index: 1000;
  max-width: calc(100vw - 40px);
  padding: 8px 10px;
  box-sizing: border-box;
  background: rgba(255,255,255,0.96);
  border-radius: 6px;
  box-shadow: 0 1px 6px #777;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* GPS button */
#gpsButton {
  position: absolute;
  left: 10px;
  bottom: 24px;
  z-index: 1100;
  min-width: 48px;
  min-height: 48px;
  padding: 10px 13px;
  border: 0;
  border-radius: 7px;
  background: rgba(255,255,255,0.97);
  box-shadow: 0 1px 6px #777;
  color: #1f2937;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#gpsButton:active {
  background: #e8f1ff;
}

#gpsButton[aria-pressed="true"] {
  color: #1769d2;
  outline: 2px solid #1769d2;
}

/* GPS accuracy circle */
.gps-accuracy-circle {
  stroke: #2478e5;
  stroke-opacity: 0.75;
  stroke-width: 1.5;
  fill: #3388ff;
  fill-opacity: 0.16;
}

/* Blue GPS dot */
.gps-location-dot {
  width: 16px;
  height: 16px;
  background: #2583ff;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow: 0 1px 5px rgba(0,0,0,0.55);
  box-sizing: border-box;
}

@media (max-width: 600px) {
  .leaflet-top.leaflet-right {
    top: 10px;
    right: 6px;
  }

  .leaflet-control-layers {
    max-height: 42vh;
    font-size: 13px;
  }

  #opacityControl {
    top: 10px;
    left: 6px;
    width: 145px;
    padding: 8px;
    font-size: 12px;
  }

  #coordinates {
    top: 160px;
    left: 6px;
    max-width: 155px;
    font-size: 12px;
  }

  #gpsCoordinates {
    top: 210px;
    left: 6px;
    max-width: 155px;
    font-size: 12px;
  }

  #gpsButton {
    left: 8px;
    bottom: 18px;
    min-width: 48px;
    min-height: 48px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div id="opacityControl">
  <div><strong>DOGAMI opacity:</strong>
    <span id="opacityValue">60%</span>
  </div>
  <input id="opacitySlider" type="range" min="0" max="100" value="60">
  <label class="opacity-row-label" for="perimeterOpacitySlider"><strong>Fire perimeter fill:</strong>
    <span id="perimeterOpacityValue">25%</span>
  </label>
  <input id="perimeterOpacitySlider" type="range" min="0" max="100" value="25">
</div>

<div id="coordinates">Click on Map for Coordinates</div>
<div id="gpsCoordinates">GPS: Off — tap GPS to start</div>

<button id="gpsButton" type="button"
        aria-pressed="false"
        title="Show my phone's GPS location">◎ GPS</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function () {
  "use strict";

  const map = L.map("map", {
    zoomControl: false,
    doubleClickZoom: true
  }).setView([42.4368, -123.1400], 11);

  // Base maps
  const streetMap = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Tiles &copy; Esri",
      maxZoom: 19
    }
  ).addTo(map);

  const topoMap = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenTopoMap contributors",
      maxZoom: 17
    }
  );

  // DOGAMI hillshade ImageServer
  const dogamiUrl =
    "https://gis.dogami.oregon.gov/arcgis/rest/services/lidar/DIGITAL_TERRAIN_MODEL_MOSAIC_HS/ImageServer/exportImage";

  const hillshade = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 0.60,
      interactive: false
    }
  );

  // Oregon PLSS Sections
  const plssUrl =
    "https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/PLSS/MapServer/export";

  const plss = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 1,
      interactive: false
    }
  );

  let hillshadeRequest = 0;
  let plssRequest = 0;
  let refreshTimer = null;

  function makeExportUrl(serviceUrl, params) {
    return serviceUrl + "?" +
      new URLSearchParams(params).toString();
  }

  function updateHillshade() {
    if (!map.hasLayer(hillshade)) return;

    const size = map.getSize();
    if (size.x < 1 || size.y < 1) return;

    const bounds = map.getBounds();
    const south = bounds.getSouth();
    const west = bounds.getWest();
    const north = bounds.getNorth();
    const east = bounds.getEast();

    const imageBounds = L.latLngBounds(
      [south, west],
      [north, east]
    );

    const params = {
      bbox: [west, south, east, north].join(","),
      bboxSR: "4326",
      imageSR: "4326",
      size: Math.max(1, Math.round(size.x)) + "," +
            Math.max(1, Math.round(size.y)),
      format: "png32",
      transparent: "true",
      f: "image"
    };

    const requestNumber = ++hillshadeRequest;
    const url = makeExportUrl(dogamiUrl, params);
    const testImage = new Image();

    testImage.onload = function () {
      if (requestNumber !== hillshadeRequest) return;
      if (!map.hasLayer(hillshade)) return;

      hillshade.setBounds(imageBounds);
      hillshade.setUrl(url);
    };

    testImage.onerror = function () {
      if (requestNumber !== hillshadeRequest) return;
      console.error("DOGAMI hillshade image request failed:", url);
    };

    testImage.src = url;
  }

  function updatePLSS() {
    if (!map.hasLayer(plss)) return;

    const size = map.getSize();
    if (size.x < 1 || size.y < 1) return;

    const bounds = map.getBounds();
    const south = bounds.getSouth();
    const west = bounds.getWest();
    const north = bounds.getNorth();
    const east = bounds.getEast();

    const imageBounds = L.latLngBounds(
      [south, west],
      [north, east]
    );

    const params = {
      bbox: [west, south, east, north].join(","),
      bboxSR: "4326",
      imageSR: "4326",
      size: Math.max(1, Math.round(size.x)) + "," +
            Math.max(1, Math.round(size.y)),
      format: "png32",
      transparent: "true",
      layers: "show:0,1",
      f: "image"
    };

    const requestNumber = ++plssRequest;
    const url = makeExportUrl(plssUrl, params);
    const testImage = new Image();

    testImage.onload = function () {
      if (requestNumber !== plssRequest) return;
      if (!map.hasLayer(plss)) return;

      plss.setBounds(imageBounds);
      plss.setUrl(url);
    };

    testImage.onerror = function () {
      if (requestNumber !== plssRequest) return;
      console.error("PLSS image request failed:", url);
    };

    testImage.src = url;
  }

  function refreshVisibleOverlays() {
    clearTimeout(refreshTimer);

    refreshTimer = setTimeout(function () {
      updateHillshade();
      updatePLSS();
    }, 200);
  }

  // NIFC / IRWIN incidents reported in the last 24 hours.
  // This NIFC view is already time-windowed; query only Oregon to avoid
  // repeatedly sending a relative-time query to the national service.
  const nifc24hUrl =
    "https://services3.arcgis.com/T4QMspbfLg3qTGWY/ArcGIS/rest/services/WFIGS_Incident_Locations_Last24h/FeatureServer/0/query";

  const nifcFireLayer = L.layerGroup().addTo(map);
  let nifcRefreshInProgress = false;

  function escapeHtml(value) {
    return String(value == null || value === "" ? "Not reported" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function fireTypeLabel(code) {
    if (code === "WF") return "Wildfire";
    if (code === "RX") return "Prescribed fire";
    if (code === "CX") return "Incident complex";
    return code || "Fire activity";
  }

  function fireMarkerColor(code) {
    if (code === "RX") return "#2e9d50"; // Prescribed fire: green
    if (code === "CX") return "#f28c00"; // Incident complex: orange
    if (code === "WF") return "#d62828"; // Wildfire: red
    return "#555555";
  }

  function formatFireDate(value) {
    if (value == null || value === "") return "Not reported";
    const date = new Date(Number(value));
    if (Number.isNaN(date.getTime())) return escapeHtml(value);
    return date.toLocaleString();
  }

  async function updateNifcFires() {
    if (nifcRefreshInProgress || !map.hasLayer(nifcFireLayer)) return;
    nifcRefreshInProgress = true;

    // Use the user's trimmed query: only Oregon and only the fields shown
    // in the fire marker popups. The service itself limits results to 24 hours.
    const params = new URLSearchParams({
      where: "POOState = 'US-OR'",
      outFields: "IncidentName,IncidentTypeCategory,InitialLatitude,InitialLongitude,POOCounty,POOProtectingAgency,POOState",
      outSR: "4326",
      f: "json"
    });

    try {
      const response = await fetch(nifc24hUrl + "?" + params.toString());
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || "NIFC query failed");

      const replacementLayer = L.layerGroup();
      const features = Array.isArray(data.features) ? data.features : [];

      features.forEach(function (feature) {
        const props = feature.attributes || {};
        // ArcGIS JSON point geometry uses x=longitude and y=latitude.
        // Fall back to the selected InitialLatitude/InitialLongitude fields.
        const geometry = feature.geometry || {};
        const lat = Number(geometry.y != null ? geometry.y : props.InitialLatitude);
        const lng = Number(geometry.x != null ? geometry.x : props.InitialLongitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        const type = props.IncidentTypeCategory || "";
        const name = props.IncidentName || "Unnamed incident";
        const marker = L.circleMarker([lat, lng], {
          radius: 7,
          color: "#ffffff",
          weight: 1.5,
          fillColor: fireMarkerColor(type),
          fillOpacity: 0.95
        });

        const popup =
          "<div style='min-width:180px'>" +
          "<strong>" + escapeHtml(name) + "</strong><br>" +
          "Type: " + escapeHtml(fireTypeLabel(type)) + "<br>" +
          "County: " + escapeHtml(props.POOCounty) + "<br>" +
          "Protecting agency: " + escapeHtml(props.POOProtectingAgency) + "<br>" +
          "State: " + escapeHtml(props.POOState) +
          "</div>";
        marker.bindPopup(popup);
        marker.addTo(replacementLayer);
      });

      // Swap in the new set only after a successful response.
      nifcFireLayer.clearLayers();
      replacementLayer.eachLayer(function (layer) {
        layer.addTo(nifcFireLayer);
      });
      console.info("NIFC/IRWIN Oregon incidents in last-24-hour feed:", features.length);
    } catch (error) {
      console.error("Could not refresh NIFC/IRWIN fire activity:", error);
    } finally {
      nifcRefreshInProgress = false;
    }
  }

  updateNifcFires();
  setInterval(updateNifcFires, 5 * 60 * 1000);

  // Current NIFC interagency fire perimeters for Jackson and Josephine counties.
  const perimeterQueryUrl =
    "https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Interagency_Perimeters_Current/FeatureServer/0/query";
  const firePerimeterLayer = L.layerGroup().addTo(map);
  let perimeterRefreshInProgress = false;
  let perimeterFillOpacity = 0.25;

  function perimeterStyle() {
    return {
      color: "#ff2100",
      weight: 3,
      opacity: 0.95,
      fillColor: "#ff1600",
      fillOpacity: perimeterFillOpacity,
      className: "fire-perimeter-glow",
      lineCap: "round",
      lineJoin: "round"
    };
  }

  function formatAcres(value) {
    const acres = Number(value);
    return Number.isFinite(acres)
      ? acres.toLocaleString(undefined, { maximumFractionDigits: 1 }) + " acres"
      : "Not reported";
  }

  async function updateFirePerimeters() {
    if (perimeterRefreshInProgress || !map.hasLayer(firePerimeterLayer)) return;
    perimeterRefreshInProgress = true;

    const params = new URLSearchParams({
      where: "attr_POOCounty = 'JACKSON' OR attr_POOCounty = 'JOSEPHINE'",
      outFields: "poly_IncidentName,poly_GISAcres,attr_POOCounty",
      outSR: "4326",
      returnGeometry: "true",
      f: "json"
    });

    try {
      const response = await fetch(perimeterQueryUrl + "?" + params.toString());
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || "Perimeter query failed");

      const replacementLayer = L.layerGroup();
      const features = Array.isArray(data.features) ? data.features : [];

      features.forEach(function (feature) {
        const attrs = feature.attributes || {};
        const geometry = feature.geometry || {};
        const rings = Array.isArray(geometry.rings) ? geometry.rings : [];
        if (!rings.length) return;

        // ArcGIS rings use [longitude, latitude]; Leaflet uses [latitude, longitude].
        const latLngRings = rings.map(function (ring) {
          return ring.map(function (point) {
            return [Number(point[1]), Number(point[0])];
          });
        });
        if (!latLngRings[0] || latLngRings[0].length < 3) return;

        const polygon = L.polygon(latLngRings, perimeterStyle());
        const popup =
          "<div style='min-width:180px'>" +
          "<strong>" + escapeHtml(attrs.poly_IncidentName || "Unnamed fire perimeter") + "</strong><br>" +
          "County: " + escapeHtml(attrs.attr_POOCounty) + "<br>" +
          "Reported size: " + escapeHtml(formatAcres(attrs.poly_GISAcres)) +
          "</div>";
        polygon.bindPopup(popup);
        polygon.addTo(replacementLayer);
      });

      firePerimeterLayer.clearLayers();
      replacementLayer.eachLayer(function (layer) {
        layer.addTo(firePerimeterLayer);
      });
      console.info("NIFC fire perimeters for Jackson/Josephine counties:", features.length);
    } catch (error) {
      console.error("Could not refresh NIFC fire perimeters:", error);
    } finally {
      perimeterRefreshInProgress = false;
    }
  }

  updateFirePerimeters();
  setInterval(updateFirePerimeters, 5 * 60 * 1000);

  // Layer menu
  L.control.layers(
    {
      "Esri Street Map": streetMap,
      "OpenTopoMap": topoMap
    },
    {
      "DOGAMI LiDAR": hillshade,
      "PLSS Sections": plss,
      "NIFC/IRWIN Fire Activity (24h)": nifcFireLayer,
      "Fire Perimeters (Jackson + Josephine)": firePerimeterLayer
    },
    {
      collapsed: true,
      position: "topright"
    }
  ).addTo(map);

  map.on("overlayadd", function (event) {
    if (event.layer === hillshade) updateHillshade();
    if (event.layer === plss) updatePLSS();
    if (event.layer === nifcFireLayer) updateNifcFires();
    if (event.layer === firePerimeterLayer) updateFirePerimeters();
  });

  map.on("moveend", refreshVisibleOverlays);
  map.on("zoomend", refreshVisibleOverlays);

  map.on("resize", function () {
    refreshVisibleOverlays();
  });

  if (typeof ResizeObserver !== "undefined") {
    const observer = new ResizeObserver(function () {
      map.invalidateSize({ pan: false });
      refreshVisibleOverlays();
    });

    observer.observe(document.getElementById("map"));
  }

  // DOGAMI opacity slider
  const opacitySlider = document.getElementById("opacitySlider");
  const opacityValue = document.getElementById("opacityValue");

  L.DomEvent.disableClickPropagation(
    document.getElementById("opacityControl")
  );

  opacitySlider.addEventListener("input", function () {
    const opacity = Number(opacitySlider.value) / 100;
    hillshade.setOpacity(opacity);
    opacityValue.textContent = opacitySlider.value + "%";
  });

  const perimeterOpacitySlider = document.getElementById("perimeterOpacitySlider");
  const perimeterOpacityValue = document.getElementById("perimeterOpacityValue");
  perimeterOpacitySlider.addEventListener("input", function () {
    perimeterFillOpacity = Number(perimeterOpacitySlider.value) / 100;
    perimeterOpacityValue.textContent = perimeterOpacitySlider.value + "%";
    firePerimeterLayer.eachLayer(function (layer) {
      layer.setStyle({ fillOpacity: perimeterFillOpacity });
    });
  });

  // Degrees and decimal minutes (DDM) only.
  // Negative values indicate south or west.
  function toDDM(value) {
    const sign = value < 0 ? "-" : "";
    const absolute = Math.abs(value);
    const degrees = Math.floor(absolute);
    const minutes = (absolute - degrees) * 60;

    return sign + degrees + "° " + minutes.toFixed(3) + "'";
  }

  const coordinatesDisplay =
    document.getElementById("coordinates");
  const gpsCoordinatesDisplay =
    document.getElementById("gpsCoordinates");

  map.on("click", function (event) {
    coordinatesDisplay.textContent =
      toDDM(event.latlng.lat) + "  " +
      toDDM(event.latlng.lng);
  });

  // Phone GPS
  const gpsButton = document.getElementById("gpsButton");

  let gpsWatchId = null;
  let gpsMarker = null;
  let gpsAccuracy = null;
  let gpsHasCentered = false;

  const gpsIcon = L.divIcon({
    className: "",
    html: '<div class="gps-location-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });

  L.DomEvent.disableClickPropagation(gpsButton);

  function stopGpsTracking() {
    if (gpsWatchId !== null && navigator.geolocation) {
      navigator.geolocation.clearWatch(gpsWatchId);
    }

    gpsWatchId = null;
    gpsHasCentered = false;
    gpsButton.setAttribute("aria-pressed", "false");
    gpsButton.textContent = "◎ GPS";
    gpsButton.title = "Show my phone's GPS location";
    gpsCoordinatesDisplay.textContent = "GPS: Off — tap GPS to start";
  }

  function gpsError(error) {
    stopGpsTracking();

    if (error.code === 1) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Permission denied. Allow browser location access, then try again.";
    } else if (error.code === 2) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Could not determine location. Check device location services.";
    } else if (error.code === 3) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Timed out. Tap GPS to try again.";
    } else {
      gpsCoordinatesDisplay.textContent =
        "GPS: Unable to get location.";
    }
  }

  gpsButton.addEventListener("click", function () {
    // Tap again to stop tracking.
    if (gpsWatchId !== null) {
      stopGpsTracking();
      return;
    }

    if (!("geolocation" in navigator)) {
      gpsCoordinatesDisplay.textContent =
        "GPS: This browser does not support location access.";
      return;
    }

    if (!window.isSecureContext) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Requires a secure HTTPS page. Open the map using HTTPS.";
      return;
    }

    gpsHasCentered = false;
    gpsButton.setAttribute("aria-pressed", "true");
    gpsButton.textContent = "GPS…";
    gpsButton.title = "Stop GPS tracking";
    gpsCoordinatesDisplay.textContent =
      "GPS: Waiting for device location…";

    gpsWatchId = navigator.geolocation.watchPosition(
      function (position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = Math.max(
          0, position.coords.accuracy || 0
        );
        const location = L.latLng(lat, lng);

        // Accuracy circle
        if (!gpsAccuracy) {
          gpsAccuracy = L.circle(location, {
            radius: accuracy,
            className: "gps-accuracy-circle",
            interactive: false
          }).addTo(map);
        } else {
          gpsAccuracy.setLatLng(location);
          gpsAccuracy.setRadius(accuracy);
        }

        // Blue location dot
        if (!gpsMarker) {
          gpsMarker = L.marker(location, {
            icon: gpsIcon,
            interactive: false,
            keyboard: false,
            zIndexOffset: 1000
          }).addTo(map);
        } else {
          gpsMarker.setLatLng(location);
        }

        gpsCoordinatesDisplay.textContent =
          "GPS: " + toDDM(lat) + "  " + toDDM(lng) +
          "  (±" + Math.round(accuracy) + " m)";

        gpsButton.textContent = "GPS ON";

        // Center the map on the first GPS fix only.
        // Later updates move the dot without dragging the map.
        if (!gpsHasCentered) {
          map.setView(location, Math.max(map.getZoom(), 15));
          gpsHasCentered = true;
        }
      },
      gpsError,
      {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 20000
      }
    );
  });

  // Initial map sizing
  setTimeout(function () {
    map.invalidateSize();
  }, 500);

})();
</script>

</body>
</html>
